# The page is served by the integration itself from where it was installed,
# so there is nothing to copy into <config>/www. Installs that predate v0.0.16
# and already copied it keep working at /local/cellar.html; either URL is fine.
#
# Embed the page with this card rather than opening it in a tab: embedded, it
# reads your live Home Assistant session from the parent frame and needs no
# stored credential. A ?token=... in the URL is ignored: a long-lived token is
# full-account and never expires, and a URL carrying one has already reached
# the access logs. Revoke any token you used that way.
#
# One CellarTracker account is supported per Home Assistant installation,
# so the card needs no account parameter.
