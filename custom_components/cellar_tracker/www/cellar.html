<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wine Cellar</title>
<style>
    :root {
        --app-bg: #ffffff;
        --card-bg: #f5f5f5;
        --card-raised: #ffffff;
        --input-bg: #ffffff;
        --text-primary: #212121;
        --text-secondary: #757575;
        --divider: #e0e0e0;
        --accent-color: #03a9f4;
        --accent-contrast: #ffffff;
        --row-hover: #f0f0f0;
        --track: #e0e0e0;

        --status-green: #2e7d32;
        --status-amber: #ef6c00;
        --status-red: #d32f2f;
        --status-grey: #9e9e9e;

        /* Tap targets. Home Assistant's own rows sit at 48px and the Companion
           app is used one-handed, so nothing interactive goes below this. */
        --touch: 48px;
        --radius: 12px;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --app-bg: #111111;
            --card-bg: #1c1c1c;
            --card-raised: #242424;
            --input-bg: #2c2c2c;
            --text-primary: #e1e1e1;
            --text-secondary: #b0b0b0;
            --divider: #3a3a3a;
            --accent-color: #29b6f6;
            --accent-contrast: #06232e;
            --row-hover: #292929;
            --track: #3a3a3a;

            --status-green: #66bb6a;
            --status-amber: #ffa726;
            --status-red: #ef5350;
            --status-grey: #8a8a8a;
        }
    }

    * { box-sizing: border-box; }

    body {
        font-family: 'Roboto', 'Segoe UI', Helvetica, Arial, sans-serif;
        background-color: var(--app-bg);
        color: var(--text-primary);
        margin: 0;
        padding: 12px 12px calc(24px + env(safe-area-inset-bottom));
        -webkit-text-size-adjust: 100%;
        /* Whatever happens below, the page never scrolls sideways inside its
           card. clip, not hidden: hidden would make the body a scroll
           container and unstick the controls. */
        overflow-x: clip;
    }

    /* ---------------------------------------------------------------- *
     * Controls: sticky, because a 150-bottle list is a long scroll and
     * losing the filter row at the top of it is what made this painful.
     * ---------------------------------------------------------------- */
    #controls {
        position: sticky;
        top: 0;
        z-index: 5;
        background-color: var(--app-bg);
        padding-bottom: 8px;
        margin-bottom: 4px;
    }

    /* The search box, and the Light racks switch beside it as one square
       button: as a labelled chip on the sort row it made that row wider
       than a phone with large text. */
    #searchbar { display: flex; gap: 8px; }
    input#search {
        flex: 1 1 auto;
        min-width: 0;
        width: 100%;
        height: var(--touch);
        padding: 0 14px;
        /* 16px exactly: anything smaller makes iOS Safari zoom on focus. */
        font-size: 16px;
        background-color: var(--input-bg);
        border: 1px solid var(--divider);
        color: var(--text-primary);
        border-radius: var(--radius);
    }
    input#search:focus {
        outline: none;
        border-color: var(--accent-color);
        box-shadow: 0 0 0 1px var(--accent-color);
    }

    /* Chips scroll sideways rather than wrapping: one predictable row, and
       the fourth chip stays reachable on a narrow phone. */
    #chips {
        display: flex;
        gap: 8px;
        margin-top: 8px;
        overflow-x: auto;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
    }
    #chips::-webkit-scrollbar { display: none; }

    .chip {
        flex: 0 0 auto;
        min-height: 40px;
        padding: 0 14px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font: inherit;
        font-size: 0.875rem;
        color: var(--text-primary);
        background-color: var(--card-bg);
        border: 1px solid var(--divider);
        border-radius: 999px;
        cursor: pointer;
        white-space: nowrap;
    }
    .chip[aria-pressed="true"] {
        background-color: var(--accent-color);
        border-color: var(--accent-color);
        color: var(--accent-contrast);
        font-weight: 600;
    }
    .chip .count {
        font-variant-numeric: tabular-nums;
        opacity: 0.75;
        font-size: 0.8125rem;
    }
    .chip[aria-pressed="true"] .count { opacity: 0.9; }

    #sortbar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        font-size: 0.8125rem;
        color: var(--text-secondary);
    }
    #sortbar label { flex: 0 0 auto; }
    /* Shown only once the settings say there are LED racks. Coloured like a
       chip when on, because like the chips it is a state you switch. */
    #light-racks {
        flex: 0 0 var(--touch);
        width: var(--touch);
        height: var(--touch);
        padding: 0;
        justify-content: center;
        border-radius: var(--radius);
        color: var(--text-secondary);
    }
    #light-racks svg { width: 24px; height: 24px; }
    #light-racks[aria-pressed="true"] { color: var(--accent-contrast); }
    #light-racks[hidden] { display: none; }
    #map-toggle {
        flex: 0 0 var(--touch);
        width: var(--touch);
        height: var(--touch);
        padding: 0;
        justify-content: center;
        border-radius: var(--radius);
        color: var(--text-secondary);
    }
    #map-toggle svg { width: 24px; height: 24px; }
    #map-toggle[aria-pressed="true"] { color: var(--accent-contrast); }
    #map-toggle[hidden] { display: none; }

    /* ---------------------------------------------------------------- *
     * The rack map: each rack as the grid of bins it is, coloured the way
     * its LEDs are. Tap a bin to see what is in it and light it.
     * ---------------------------------------------------------------- */
    #rack-map { margin-bottom: 12px; }
    #rack-map[hidden] { display: none; }
    .rack {
        background-color: var(--card-bg);
        border-radius: var(--radius);
        padding: 10px 12px 12px;
        margin-bottom: 8px;
    }
    .rack h2 {
        margin: 0 0 8px;
        font-size: 0.9375rem;
        font-weight: 600;
    }
    .rack h2 .count { font-weight: 400; color: var(--text-secondary); font-size: 0.8125rem; }
    /* The row letters are a column of their own and the bin numbers a row,
       so a 13-wide rack still fits a 280px phone without labels in the bins. */
    .rack-grid {
        display: grid;
        gap: 3px;
        font-size: 0.6875rem;
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
    }
    .rack-grid .axis {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
    }
    .cell {
        aspect-ratio: 1;
        min-width: 0;
        padding: 0;
        border: 1px solid var(--divider);
        border-radius: 4px;
        background-color: transparent;
        cursor: pointer;
    }
    .cell:focus-visible { outline: 2px solid var(--accent-color); outline-offset: 1px; }
    .cell.gap { visibility: hidden; cursor: default; }
    .cell.state-past { background-color: var(--status-red); border-color: var(--status-red); }
    .cell.state-urgent { background-color: var(--status-amber); border-color: var(--status-amber); }
    .cell.state-ready { background-color: var(--status-green); border-color: var(--status-green); }
    .cell.state-aging { background-color: var(--accent-color); border-color: var(--accent-color); }
    .cell.state-unknown { background-color: var(--status-grey); border-color: var(--status-grey); }
    /* Holds bottles, none of them in the list on screen: dark on the rack. */
    .cell.state-other {
        background-color: var(--track);
        border-color: var(--text-secondary);
        border-style: dashed;
    }
    .cell[aria-pressed="true"] {
        outline: 2px solid var(--text-primary);
        outline-offset: 1px;
    }
    .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        margin-top: 10px;
        font-size: 0.75rem;
        color: var(--text-secondary);
    }
    .legend span { display: inline-flex; align-items: center; gap: 4px; }
    .legend .cell { width: 12px; cursor: default; }
    .bin-detail { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
    .bin-detail h3 { margin: 0; font-size: 0.875rem; font-weight: 600; }
    .bin-detail p { margin: 0; font-size: 0.8125rem; color: var(--text-secondary); }
    #sort {
        /* A select is otherwise as wide as its longest option and refuses
           to shrink, which pushed the row past the edge of a narrow phone. */
        flex: 1 1 auto;
        min-width: 0;
        height: 36px;
        font: inherit;
        font-size: 0.8125rem;
        color: var(--text-primary);
        background-color: var(--input-bg);
        border: 1px solid var(--divider);
        border-radius: 8px;
        padding: 0 8px;
    }
    #direction {
        flex: 0 0 auto;
        min-width: 40px;
        height: 36px;
        font: inherit;
        color: var(--text-primary);
        background-color: var(--input-bg);
        border: 1px solid var(--divider);
        border-radius: 8px;
        cursor: pointer;
    }

    /* ---------------------------------------------------------------- *
     * The list
     * ---------------------------------------------------------------- */
    #list { display: flex; flex-direction: column; gap: 6px; }

    .bottle {
        background-color: var(--card-bg);
        border: 1px solid transparent;
        border-radius: var(--radius);
        overflow: hidden;
    }
    .bottle[data-open="true"] {
        background-color: var(--card-raised);
        border-color: var(--divider);
    }

    .summary {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 12px;
        width: 100%;
        min-height: var(--touch);
        padding: 10px 12px;
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        text-align: left;
        cursor: pointer;
    }
    .summary:hover { background-color: var(--row-hover); }
    .summary:focus-visible { outline: 2px solid var(--accent-color); outline-offset: -2px; }

    .name {
        min-width: 0;
        overflow-wrap: anywhere;
        font-weight: 600;
        font-size: 0.9375rem;
        line-height: 1.3;
    }
    .price {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        font-size: 0.9375rem;
        text-align: right;
        white-space: nowrap;
    }
    .meta {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.8125rem;
        color: var(--text-secondary);
    }
    .meta .dot { opacity: 0.5; }

    /* The drink window, as a position rather than two numbers. The bar says
       "where in its life is this bottle"; the pill says what to do about it. */
    .window { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin-top: 6px; }
    .track {
        position: relative;
        flex: 1 1 auto;
        height: 4px;
        border-radius: 2px;
        background-color: var(--track);
        overflow: hidden;
    }
    .fill { height: 100%; border-radius: 2px; }
    .pill {
        flex: 0 0 auto;
        font-size: 0.75rem;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 999px;
        white-space: nowrap;
    }
    .years {
        flex: 0 0 auto;
        font-size: 0.75rem;
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
    }

    .state-ready .fill { background-color: var(--status-green); }
    .state-ready .pill { background-color: var(--status-green); color: #fff; }
    .state-urgent .fill { background-color: var(--status-amber); }
    .state-urgent .pill { background-color: var(--status-amber); color: #241300; }
    .state-past .fill { background-color: var(--status-red); }
    .state-past .pill { background-color: var(--status-red); color: #fff; }
    .state-aging .fill { background-color: var(--accent-color); }
    .state-aging .pill { background-color: var(--accent-color); color: var(--accent-contrast); }
    .state-unknown .pill { background-color: var(--track); color: var(--text-secondary); }

    /* Drawer */
    .drawer {
        padding: 4px 12px 12px;
        border-top: 1px solid var(--divider);
        font-size: 0.8125rem;
    }
    .facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 8px 0 12px; }
    .facts dt { color: var(--text-secondary); }
    .facts dd { margin: 0; font-variant-numeric: tabular-nums; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .action {
        min-height: 40px;
        padding: 0 14px;
        display: inline-flex;
        align-items: center;
        font: inherit;
        font-size: 0.8125rem;
        color: var(--text-primary);
        background-color: var(--input-bg);
        border: 1px solid var(--divider);
        border-radius: 8px;
        cursor: pointer;
        text-decoration: none;
    }
    .action:hover { border-color: var(--accent-color); color: var(--accent-color); }

    #status { padding: 32px 12px; text-align: center; color: var(--text-secondary); }

    /* Desktop earns one dense line per bottle: the four blocks sit side by
       side rather than stacking, so a screenful shows twice as many. Each is
       placed explicitly - relying on source order here is what put the name
       in the middle of the row with a hole beside it. */
    @media (min-width: 720px) {
        body { padding: 20px; max-width: 1100px; margin: 0 auto; }
        .summary {
            grid-template-columns:
                minmax(0, 3fr) minmax(0, 1.4fr) minmax(160px, 2fr) auto;
            align-items: center;
            gap: 0 16px;
        }
        .name { grid-column: 1; grid-row: 1; }
        .meta { grid-column: 2; grid-row: 1; }
        .window { grid-column: 3; grid-row: 1; margin-top: 0; }
        .price { grid-column: 4; grid-row: 1; }
    }

    @media (prefers-reduced-motion: no-preference) {
        .chip, .summary, .action { transition: background-color .15s, border-color .15s, color .15s; }
    }
</style>
</head>
<body>

<div id="controls">
    <div id="searchbar">
        <input type="text" id="search" placeholder="Search wines, vintage, bin…"
               autocomplete="off" autocorrect="off" spellcheck="false"
               aria-label="Search the cellar">
        <button type="button" id="light-racks" class="chip" aria-pressed="true" hidden
                aria-label="Light racks"
                title="Light racks: show the list on the wine racks, and tap a bottle to light its bin">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
                <path d="M12 2a7 7 0 0 0-4 12.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26A7 7 0 0 0 12 2zm-3 18h6v1a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-1z"/>
            </svg>
        </button>
        <button type="button" id="map-toggle" class="chip" aria-pressed="false" hidden
                aria-label="Rack map" aria-controls="rack-map"
                title="Rack map: see the racks bin by bin, and tap a bin to see what is in it">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
                <path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm8-2h8v8h-8v-8zm2 2v4h4v-4h-4z"/>
            </svg>
        </button>
    </div>

    <!-- Static markup rather than generated: the chips are the page's primary
         navigation, so they paint before any data arrives. Only the counts are
         filled in later. -->
    <div id="chips" role="group" aria-label="Filter by drinking window">
        <button type="button" class="chip" data-filter="all" aria-pressed="true">
            All wines <span class="count" data-count="all"></span>
        </button>
        <button type="button" class="chip" data-filter="ready" aria-pressed="false">
            Ready to drink <span class="count" data-count="ready"></span>
        </button>
        <button type="button" class="chip" data-filter="past" aria-pressed="false">
            Past window <span class="count" data-count="past"></span>
        </button>
        <button type="button" class="chip" data-filter="aging" aria-pressed="false">
            Needs aging <span class="count" data-count="aging"></span>
        </button>
    </div>

    <div id="sortbar">
        <label for="sort">Sort</label>
        <select id="sort">
            <option value="Wine">Wine</option>
            <option value="Vintage">Vintage</option>
            <option value="Valuation">Value</option>
            <option value="EndConsume">Drink by</option>
            <option value="Bin">Bin</option>
            <option value="Location">Location</option>
        </select>
        <button type="button" id="direction" aria-label="Reverse sort order">▲</button>
    </div>
</div>

<div id="rack-map" hidden></div>
<div id="status" role="status">Loading cellar…</div>
<div id="list"></div>

<script>
    // ------------------------------------------------------------------
    // Pure logic.
    //
    // Everything below this comment and above "Page wiring" touches no DOM
    // and no network, which is what lets the test suite call it directly
    // under node (tests/test_dashboard_filters.py). Keep these as top-level
    // declarations - wrapping them in an IIFE would make them untestable
    // without adding a build step this page deliberately does not have.
    // ------------------------------------------------------------------

    // A year, or 0 for "the export does not say". CellarTracker leaves these
    // blank for most wines, and blanks arrive as "", null, or prose.
    function toYear(value) {
        const year = parseInt(value, 10);
        return Number.isFinite(year) && year > 0 ? year : 0;
    }

    function toNumber(value) {
        const number = parseFloat(value);
        return Number.isFinite(number) ? number : 0;
    }

    // Returns a copy: the fetched payload is not ours to rewrite in place.
    function normaliseWine(raw) {
        const wine = Object.assign({}, raw);
        wine.Vintage = toYear(raw && raw.Vintage);
        wine.BeginConsume = toYear(raw && raw.BeginConsume);
        wine.EndConsume = toYear(raw && raw.EndConsume);
        wine.Valuation = toNumber(raw && raw.Valuation);
        return wine;
    }

    // The same rule as _drink_window_counts in cellar_data.py, which is what
    // the sensors report. tests/test_dashboard_agrees_with_sensors.py runs
    // both over one cellar and compares, because two implementations of one
    // rule is exactly what drifts.
    function drinkWindowState(wine, year) {
        const begin = toYear(wine && wine.BeginConsume);
        const end = toYear(wine && wine.EndConsume);

        if (!begin && !end) return 'unknown';
        // Checked first, so an inverted window (from 2030, by 2020) reads as
        // already over rather than as still laying down.
        if (end && end < year) return 'past';
        if (begin && begin > year) return 'aging';
        return 'ready';
    }

    // Where this year sits inside the window, 0 to 1, or null if the window
    // has no width to speak of. Only drawn when both bounds are given: half a
    // window cannot be a position.
    function windowProgress(wine, year) {
        const begin = toYear(wine && wine.BeginConsume);
        const end = toYear(wine && wine.EndConsume);
        if (!begin || !end) return null;
        if (end <= begin) return 1;
        const position = (year - begin) / (end - begin);
        return Math.min(1, Math.max(0, position));
    }

    // The final year of a window: still ready, but worth saying out loud. This
    // is what the old page painted red - the urgency was real, the "expired"
    // reading was not.
    function isUrgent(wine, year) {
        return drinkWindowState(wine, year) === 'ready'
            && toYear(wine && wine.EndConsume) === year;
    }

    const SEARCH_FIELDS = ['Wine', 'Vintage', 'Location', 'Bin', 'Barcode'];

    // Every token has to appear somewhere, so "bindi 2023" narrows rather than
    // finding nothing. The old page concatenated three fields and did one
    // substring test, which meant a vintage could not be searched at all.
    function matchesSearch(wine, term) {
        const tokens = String(term == null ? '' : term).toLowerCase().split(/\s+/)
            .filter((token) => token.length > 0);
        if (tokens.length === 0) return true;

        const haystack = SEARCH_FIELDS
            .map((field) => (wine && wine[field] != null ? String(wine[field]) : ''))
            .join(' ')
            .toLowerCase();

        return tokens.every((token) => haystack.indexOf(token) !== -1);
    }

    function filterCounts(wines, year) {
        const counts = { all: wines.length, ready: 0, past: 0, aging: 0 };
        wines.forEach((wine) => {
            const state = drinkWindowState(wine, year);
            if (state in counts) counts[state] += 1;
        });
        return counts;
    }

    function selectWines(wines, options) {
        const filter = (options && options.filter) || 'all';
        const term = (options && options.term) || '';
        const year = (options && options.year) || new Date().getFullYear();
        const wanted = ['ready', 'past', 'aging'].indexOf(filter) === -1 ? null : filter;

        return wines.filter((wine) => {
            if (wanted && drinkWindowState(wine, year) !== wanted) return false;
            return matchesSearch(wine, term);
        });
    }

    function isBlank(value) {
        return value == null || value === '';
    }

    // Whether an LED rack can show this bottle: its location is one of the
    // racks the integration was told about, and it has a bin to light.
    // The integration's rule: case and spacing do not make a different rack.
    function locationKey(value) {
        return isBlank(value) ? '' : String(value).trim().split(/\s+/).join(' ').toLowerCase();
    }

    function isOnRack(wine, racks) {
        if (!wine || isBlank(wine.Bin) || String(wine.Bin).trim() === '') return false;
        const location = locationKey(wine.Location);
        return location !== '' && (racks || []).some((rack) => locationKey(rack) === location);
    }

    // What the racks should show for the list on screen. The whole cellar
    // with no search is the overview; anything narrower lights only the
    // bottles in it, by unique_bottle_id, so the integration never has to
    // repeat this page's filter and search to understand the request.
    function rackRequest(wines, racks, options) {
        if (!racks || racks.length === 0) return null;
        const filter = (options && options.filter) || 'all';
        const term = String((options && options.term) || '').trim();
        if (filter === 'all' && term === '') {
            return { service: 'show_overview', data: {} };
        }
        const bottles = selectWines(wines, options)
            .filter((wine) => isOnRack(wine, racks) && !isBlank(wine.unique_bottle_id))
            .map((wine) => String(wine.unique_bottle_id));
        return { service: 'highlight_bottles', data: { bottles } };
    }

    // A bin the way people write it, as [row, column] from 0, or null. The
    // integration's parse_bin, which is the boards' grammar: a row letter,
    // then digits, with spaces, dashes and underscores allowed after the
    // letter. "D2", "d 2", "D-02" are all one bin; "A1B" is none.
    const ROW_LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    function parseBin(value) {
        const text = isBlank(value) ? '' : String(value).trim().toUpperCase();
        const match = /^([A-Z])[\s\-_]*((?:[0-9][\s\-_]*)+)$/.exec(text);
        if (!match) return null;
        const col = parseInt(match[2].replace(/[\s\-_]/g, ''), 10);
        if (!(col >= 1 && col <= 999)) return null;
        return [ROW_LETTERS.indexOf(match[1]), col - 1];
    }

    // How urgently a bottle wants dealing with: the rank racks.py gives it,
    // which is the colour its bin gets. A bin shows its most urgent bottle.
    const RANK_STATE = ['empty', 'unknown', 'aging', 'ready', 'urgent', 'past'];
    function wineRank(wine, year) {
        const state = drinkWindowState(wine, year);
        if (state === 'unknown') return 1;
        if (state === 'aging') return 2;
        if (state === 'past') return 5;
        return isUrgent(wine, year) ? 4 : 3;
    }

    // One rack as cells, row-major, the same envelope the boards paint.
    // `shown` is the list on screen, or null for all of it: a bin whose
    // bottles are all outside it is 'other', which is a dark bin on the rack
    // while that list is highlighted there.
    function rackCells(wines, shape, year, shown) {
        const missing = new Set((shape.missing || []).map((cell) => cell[0] + ',' + cell[1]));
        const cells = [];
        for (let row = 0; row < shape.rows; row += 1) {
            for (let col = 0; col < shape.cols; col += 1) {
                cells.push({
                    row, col,
                    bin: ROW_LETTERS[row] + (col + 1),
                    exists: !missing.has(row + ',' + col),
                    bottles: [],
                    rank: 0,
                    state: 'empty',
                });
            }
        }
        const here = locationKey(shape.location);
        wines.forEach((wine) => {
            if (locationKey(wine.Location) !== here) return;
            const at = parseBin(wine.Bin);
            if (!at || at[0] >= shape.rows || at[1] >= shape.cols) return;
            const cell = cells[at[0] * shape.cols + at[1]];
            if (!cell.exists) return;
            cell.bottles.push(wine);
            if (!shown || shown.has(wine)) cell.rank = Math.max(cell.rank, wineRank(wine, year));
        });
        cells.forEach((cell) => {
            if (cell.rank > 0) cell.state = RANK_STATE[cell.rank];
            else if (cell.bottles.length > 0) cell.state = 'other';
        });
        return cells;
    }

    // The wine's page, in the form CellarTracker's own app shares. The classic
    // wine.asp?iWine= address lost the wine on a phone: CellarTracker handed
    // it to its app without the id, and the app opened on its start screen.
    // This one opens the wine in the app, and in a browser without it.
    function wineUrl(iWine) {
        return 'https://go.cellartracker.com/wine/'
            + encodeURIComponent(String(iWine).trim());
    }

    // normaliseWine collapses an unrecorded year to 0, and 0 is smaller than
    // every real one - so sorting by vintage ascending led with every NV
    // bottle in the cellar. There is no year zero, so 0 means "not recorded"
    // for these three and nothing else. A *valuation* of 0 is left alone: a
    // bottle really can be worth nothing recorded, and cheapest-first should
    // still show it.
    const UNRECORDED_AS_ZERO = { Vintage: true, BeginConsume: true, EndConsume: true };

    function isMissing(value, key) {
        if (isBlank(value)) return true;
        return UNRECORDED_AS_ZERO[key] === true && Number(value) === 0;
    }

    // Decorated with the arrival index and compared on it last, so ties keep
    // the order they came in whichever way the column is pointing. A cellar
    // holds six identical bottles of the same wine; they should not shuffle
    // every time the sort is toggled.
    function sortWines(wines, key, direction) {
        const sign = direction === 'desc' ? -1 : 1;
        return wines
            .map((wine, index) => ({ wine, index }))
            .sort((a, b) => {
                let left = a.wine[key];
                let right = b.wine[key];

                // A bin nobody filled in sorts last in both directions rather
                // than heading the list because "" precedes every letter.
                const leftMissing = isMissing(left, key);
                const rightMissing = isMissing(right, key);
                if (leftMissing || rightMissing) {
                    if (leftMissing && rightMissing) return a.index - b.index;
                    return leftMissing ? 1 : -1;
                }

                if (typeof left === 'string') left = left.toLowerCase();
                if (typeof right === 'string') right = right.toLowerCase();

                if (left < right) return -1 * sign;
                if (left > right) return 1 * sign;
                return a.index - b.index;
            })
            .map((entry) => entry.wine);
    }

    // ------------------------------------------------------------------
    // Page wiring
    // ------------------------------------------------------------------
    // Where a ?token= used to be kept. Only ever cleared now.
    const TOKEN_STORAGE_KEY = 'cellartracker_token';

    // A Home Assistant long-lived token is full-account and never expires.
    // In a URL it has reached the server's and any proxy's access logs before
    // this script runs, so the page no longer accepts one at all: it uses the
    // Home Assistant session of the page that embeds it, or nothing. A
    // ?token= still in a bookmark is taken out of the address bar, so it at
    // least stops being added to history, and any copy an older version of
    // the page stored is dropped.
    function dropLegacyUrlToken() {
        try {
            sessionStorage.removeItem(TOKEN_STORAGE_KEY);
        } catch (e) { /* storage unavailable in private mode */ }

        const params = new URLSearchParams(window.location.search);
        if (!params.has('token')) return;
        console.warn(
            'cellar.html: ?token= in the URL is no longer supported and was ' +
            'ignored. Revoke that token, and embed this page with an iframe ' +
            'card so it can use your Home Assistant session.'
        );
        params.delete('token');
        const query = params.toString();
        window.history.replaceState(
            null, '', window.location.pathname + (query ? '?' + query : '')
        );
    }

    function tokenFromHomeAssistant() {
        // Try the embedding page first, then this document. Each lookup is
        // guarded: reading a cross-origin parent throws.
        const sources = [
            () => window.parent && window.parent.document,
            () => document
        ];
        for (const source of sources) {
            try {
                const found = source()
                    ?.querySelector('home-assistant')
                    ?.hass?.auth?.data?.access_token;
                if (found) return found;
            } catch (e) { /* cross-origin or not embedded */ }
        }
        return null;
    }

    function getHassToken() {
        dropLegacyUrlToken();
        return tokenFromHomeAssistant();
    }

    const token = getHassToken();
    const fetchOpts = token
        ? {
            credentials: 'same-origin',
            headers: { Authorization: 'Bearer ' + token }
        }
        : { credentials: 'same-origin' };

    // One CellarTracker account per installation, so this is normally absent
    // and the endpoints need no account parameter. It is forwarded for the
    // install that still holds a second entry from before single-instance
    // was enforced: there the API selects on it, and dropping it would serve
    // the other account's cellar. With one account configured the API
    // ignores it, so a stale value on an old card URL stays harmless.
    //   url: /cellartracker/cellar.html?entry_id=abc123
    // Read after the token strip, which rebuilds the query from the
    // remaining parameters and so preserves this one.
    const entryId = (new URLSearchParams(window.location.search).get('entry_id') || '').trim();

    // The inventory endpoint serves all 66 export columns by default, for
    // the sake of cards people built against it. This page renders a handful,
    // so it asks for the compact projection instead - roughly a tenth of
    // the bytes on a large cellar.
    const COMPACT_PATHS = { inventory: true };

    function apiUrl(path) {
        const params = new URLSearchParams();
        if (entryId) params.set('entry_id', entryId);
        if (COMPACT_PATHS[path]) params.set('view', 'compact');
        const query = params.toString();
        return '/api/cellartracker/' + path + (query ? '?' + query : '');
    }

    async function fetchJson(path) {
        const response = await fetch(apiUrl(path), fetchOpts);
        if (response.ok) return response.json();

        // The endpoints answer 200 or an auth status and nothing else. The
        // 400/404 disambiguation bodies this used to decode are gone with
        // the multi-account API.
        if (response.status === 401 || response.status === 403) {
            throw new Error(
                'Not authorised (' + response.status + '). Open this page from ' +
                'Home Assistant so it can use your session.'
            );
        }
        throw new Error('Could not load data (HTTP ' + response.status + ').');
    }

    // Runs one of the integration's actions with the same session the reads
    // use. Resolves to whether Home Assistant accepted it.
    function callService(service, data) {
        const headers = Object.assign(
            { 'Content-Type': 'application/json' }, fetchOpts.headers || {}
        );
        return fetch('/api/services/cellar_tracker/' + service, {
            method: 'POST',
            credentials: 'same-origin',
            headers,
            body: JSON.stringify(data || {}),
        }).then((response) => response.ok, () => false);
    }

    // What the user has chosen. Held apart from the data so a refresh replaces
    // the cellar without disturbing the view of it.
    const view = { filter: 'all', term: '', sort: 'Wine', direction: 'asc' };
    let allWines = [];
    let currencySymbol = '$';
    let currentYear = new Date().getFullYear();
    // The LED racks' locations, from the settings. Empty means no LEDs, and
    // then the page never calls a rack action at all.
    let ledRacks = [];
    // Their shapes, for the map. Empty without the LED racks option.
    let rackShapes = [];
    const RACK_MAP_KEY = 'cellartracker_rack_map';
    let mapOpen = false;
    try {
        mapOpen = localStorage.getItem(RACK_MAP_KEY) === 'open';
    } catch (e) { /* storage unavailable: start closed */ }
    // The bin last tapped on the map, kept across redraws.
    let mapPick = null;
    // The bin to hand focus back to after a redraw, and its new button.
    let mapFocus = null;
    let mapFocusButton = null;
    const LIGHT_RACKS_KEY = 'cellartracker_light_racks';
    let lightRacks = true;
    try {
        lightRacks = localStorage.getItem(LIGHT_RACKS_KEY) !== 'off';
    } catch (e) { /* storage unavailable: keep the default */ }

    const STATE_LABEL = {
        ready: 'Ready', past: 'Past window', aging: 'Needs aging', unknown: 'No window',
    };

    function element(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        // textContent throughout: every string here is server data.
        if (text != null) node.textContent = text;
        return node;
    }

    function formatPrice(value) {
        return currencySymbol + ' ' + Math.round(value);
    }

    function yearsLabel(wine) {
        const begin = wine.BeginConsume ? String(wine.BeginConsume) : '';
        const end = wine.EndConsume ? String(wine.EndConsume) : '';
        if (begin && end) return begin + '–' + end;
        if (end) return 'by ' + end;
        if (begin) return 'from ' + begin;
        return '';
    }

    function buildWindow(wine) {
        const state = drinkWindowState(wine, currentYear);
        const urgent = isUrgent(wine, currentYear);
        const row = element('div', 'window state-' + (urgent ? 'urgent' : state));

        const progress = windowProgress(wine, currentYear);
        if (progress !== null) {
            const track = element('div', 'track');
            const fill = element('div', 'fill');
            fill.style.width = Math.round(progress * 100) + '%';
            track.appendChild(fill);
            row.appendChild(track);
        }

        const years = yearsLabel(wine);
        if (years) row.appendChild(element('span', 'years', years));
        row.appendChild(element('span', 'pill', urgent ? 'Drink this year' : STATE_LABEL[state]));
        return row;
    }

    function buildDrawer(wine) {
        const drawer = element('div', 'drawer');

        const facts = element('dl', 'facts');
        const rows = [
            ['Location', wine.Location],
            ['Bin', wine.Bin],
            ['Barcode', wine.Barcode],
            ['Drink window', yearsLabel(wine) || 'Not recorded'],
            ['Value', formatPrice(wine.Valuation)],
        ];
        rows.forEach(([label, value]) => {
            if (isBlank(value)) return;
            facts.appendChild(element('dt', null, label));
            facts.appendChild(element('dd', null, String(value)));
        });
        drawer.appendChild(facts);

        const actions = element('div', 'actions');
        if (!isBlank(wine.Bin)) {
            const copy = element('button', 'action', 'Copy bin');
            copy.type = 'button';
            copy.addEventListener('click', (event) => {
                event.stopPropagation();
                copyText(String(wine.Bin), copy, 'Copy bin');
            });
            actions.appendChild(copy);
        }
        if (isOnRack(wine, ledRacks)) {
            const light = element('button', 'action', 'Show on rack');
            light.type = 'button';
            light.addEventListener('click', (event) => {
                event.stopPropagation();
                locate(wine, light);
            });
            actions.appendChild(light);
        }
        if (wine.iWine) {
            const open = element('a', 'action', 'Open in CellarTracker');
            open.href = wineUrl(wine.iWine);
            open.target = '_blank';
            open.rel = 'noopener noreferrer';
            open.addEventListener('click', (event) => {
                event.stopPropagation();
                if (openFromHomeAssistant(open.href)) event.preventDefault();
            });
            actions.appendChild(open);
        }
        drawer.appendChild(actions);
        return drawer;
    }

    // The iframe card sandboxes this page, and a window it opens inherits
    // that sandbox. In the Companion app such a window can go nowhere at all,
    // so the link opens from Home Assistant's own window instead, as Home
    // Assistant's own external links do. Same origin, so the parent is
    // reachable; anywhere it is not, the plain link takes over.
    function openFromHomeAssistant(url) {
        try {
            const host = window.top;
            if (!host || host === window || typeof host.open !== 'function') return false;
            host.open(url, '_blank', 'noopener,noreferrer');
            return true;
        } catch (e) {
            return false;
        }
    }

    // execCommand is deprecated, and it is also the only thing that works
    // without a secure context. A great many Home Assistant installs are
    // reached over plain http on a LAN address, where navigator.clipboard does
    // not exist at all - so this is the common path here, not the fallback.
    function legacyCopy(text) {
        try {
            const field = document.createElement('textarea');
            field.value = text;
            field.setAttribute('readonly', '');
            field.style.position = 'fixed';
            field.style.opacity = '0';
            document.body.appendChild(field);
            field.select();
            const copied = document.execCommand('copy') === true;
            document.body.removeChild(field);
            return copied;
        } catch (e) {
            return false;
        }
    }

    // Resolves to whether the text actually reached a clipboard. Saying
    // "Copied" when nothing was copied is worse than saying nothing: the user
    // walks to the rack and pastes whatever was there before.
    function writeToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            try {
                return Promise.resolve(navigator.clipboard.writeText(text))
                    .then(() => true, () => legacyCopy(text));
            } catch (e) { /* fall through to the legacy path */ }
        }
        return Promise.resolve(legacyCopy(text));
    }

    function copyText(text, button, original) {
        writeToClipboard(text).then((copied) => {
            button.textContent = copied ? 'Copied' : 'Could not copy';
            setTimeout(() => { button.textContent = original; }, copied ? 1200 : 2000);
        });
    }

    // Lights one bottle's bin on its rack. With a button, says how it went:
    // claiming "Lit" when nothing was lit sends someone to a dark rack.
    function locate(wine, button) {
        // The latest action wins: a list update still waiting to be sent
        // would repaint the rack and put this bin out straight away.
        clearTimeout(rackTimer);
        const done = callService('locate_bottle', {
            location: String(wine.Location).trim(),
            bin: String(wine.Bin).trim(),
        });
        if (!button) return done;
        return done.then((ok) => {
            button.textContent = ok ? 'Lit on the rack' : 'Could not light it';
            setTimeout(() => { button.textContent = 'Show on rack'; }, ok ? 1500 : 2500);
        });
    }

    // Filters and searches move fast; the racks follow once the typing stops.
    let rackTimer = null;
    function syncRacks() {
        if (!lightRacks || ledRacks.length === 0) return;
        clearTimeout(rackTimer);
        rackTimer = setTimeout(() => {
            const request = rackRequest(allWines, ledRacks, {
                filter: view.filter, term: view.term, year: currentYear,
            });
            if (request) callService(request.service, request.data);
        }, 600);
    }

    function buildBottle(wine) {
        const card = element('div', 'bottle');
        card.setAttribute('data-open', 'false');

        const summary = element('button', 'summary');
        summary.type = 'button';
        summary.setAttribute('aria-expanded', 'false');

        summary.appendChild(element('div', 'name', wine.Wine || 'Unknown'));
        summary.appendChild(element('div', 'price', formatPrice(wine.Valuation)));

        const meta = element('div', 'meta');
        const parts = [wine.Vintage ? String(wine.Vintage) : 'NV'];
        if (!isBlank(wine.Location)) parts.push(String(wine.Location));
        if (!isBlank(wine.Bin)) parts.push(String(wine.Bin));
        parts.forEach((part, index) => {
            if (index > 0) meta.appendChild(element('span', 'dot', '·'));
            meta.appendChild(element('span', null, part));
        });
        summary.appendChild(meta);
        summary.appendChild(buildWindow(wine));

        let drawer = null;
        summary.addEventListener('click', () => {
            const open = card.getAttribute('data-open') === 'true';
            if (open) {
                if (drawer) card.removeChild(drawer);
                drawer = null;
            } else {
                drawer = buildDrawer(wine);
                card.appendChild(drawer);
                // Opening a bottle is asking where it is.
                if (lightRacks && isOnRack(wine, ledRacks)) locate(wine);
            }
            card.setAttribute('data-open', open ? 'false' : 'true');
            summary.setAttribute('aria-expanded', open ? 'false' : 'true');
        });

        card.appendChild(summary);
        return card;
    }

    const MAP_LABEL = {
        past: 'Past window', urgent: 'Drink this year', ready: 'Ready',
        aging: 'Needs aging', unknown: 'No window', other: 'Not in the list', empty: 'Empty',
    };

    function cellLabel(shape, cell) {
        const count = cell.bottles.length;
        return shape.location + ' ' + cell.bin + ': '
            + (count === 0 ? 'empty' : count + (count === 1 ? ' bottle, ' : ' bottles, ')
                + MAP_LABEL[cell.state].toLowerCase());
    }

    function pickBin(shape, cell) {
        const same = mapPick && mapPick.location === shape.location && mapPick.bin === cell.bin;
        mapPick = same ? null : { location: shape.location, bin: cell.bin };
        // The redraw replaces every bin, the focused one too. Put focus back
        // on the bin just used, so a keyboard can close it again or move on.
        mapFocus = { location: shape.location, bin: cell.bin };
        renderMap();
        if (mapFocusButton) mapFocusButton.focus();
        mapFocus = null;
        mapFocusButton = null;
        // Tapping a bin is asking where it is - an empty one too, which is
        // how to find the space for a bottle you are about to put away.
        if (!same && lightRacks) locate({ Location: shape.location, Bin: cell.bin });
    }

    function buildRack(shape, shown, widest) {
        const cells = rackCells(allWines, shape, currentYear, shown);
        const section = element('section', 'rack');
        const heading = element('h2', null, shape.location + ' ');
        const bottles = cells.reduce((sum, cell) => sum + cell.bottles.length, 0);
        heading.appendChild(element('span', 'count',
            bottles + (bottles === 1 ? ' bottle' : ' bottles')));
        section.appendChild(heading);

        const grid = element('div', 'rack-grid');
        grid.style.gridTemplateColumns = 'auto repeat(' + shape.cols + ', minmax(0, 1fr))';
        // Every rack at one bin size, so a 7-wide rack sits beside a 13-wide
        // one as it does in the cellar, and never more than 36px a bin: on a
        // desktop it should not turn into dinner plates.
        grid.style.width = 'calc((100% - 24px) * ' + shape.cols + ' / ' + widest + ' + 24px)';
        grid.style.maxWidth = (24 + shape.cols * 39) + 'px';
        grid.setAttribute('role', 'group');
        grid.setAttribute('aria-label', shape.location);
        grid.appendChild(element('span', 'axis'));
        for (let col = 0; col < shape.cols; col += 1) {
            grid.appendChild(element('span', 'axis', String(col + 1)));
        }
        let picked = null;
        cells.forEach((cell) => {
            if (cell.col === 0) grid.appendChild(element('span', 'axis', ROW_LETTERS[cell.row]));
            const button = element('button', 'cell state-' + cell.state);
            button.type = 'button';
            if (!cell.exists) {
                button.className = 'cell gap';
                button.disabled = true;
                button.setAttribute('aria-hidden', 'true');
                grid.appendChild(button);
                return;
            }
            const isPick = mapPick && mapPick.location === shape.location
                && mapPick.bin === cell.bin;
            if (isPick) picked = cell;
            if (mapFocus && mapFocus.location === shape.location && mapFocus.bin === cell.bin) {
                mapFocusButton = button;
            }
            button.setAttribute('aria-pressed', isPick ? 'true' : 'false');
            button.setAttribute('aria-label', cellLabel(shape, cell));
            button.title = cellLabel(shape, cell);
            button.addEventListener('click', () => pickBin(shape, cell));
            grid.appendChild(button);
        });
        section.appendChild(grid);

        if (picked) {
            const detail = element('div', 'bin-detail');
            detail.appendChild(element('h3', null, shape.location + ' · ' + picked.bin));
            if (picked.bottles.length === 0) {
                detail.appendChild(element('p', null, 'Empty bin.'));
            } else {
                picked.bottles.forEach((wine) => detail.appendChild(buildBottle(wine)));
            }
            section.appendChild(detail);
        }
        return section;
    }

    function buildLegend() {
        const legend = element('div', 'legend');
        ['past', 'urgent', 'ready', 'aging', 'unknown', 'other', 'empty'].forEach((state) => {
            const item = element('span');
            const swatch = element('span', 'cell state-' + state);
            swatch.setAttribute('aria-hidden', 'true');
            item.appendChild(swatch);
            item.appendChild(element('span', null, MAP_LABEL[state]));
            legend.appendChild(item);
        });
        return legend;
    }

    function renderMap() {
        const map = document.getElementById('rack-map');
        if (!map) return;
        map.hidden = !mapOpen || rackShapes.length === 0;
        if (map.hidden) {
            map.replaceChildren();
            return;
        }
        const filtered = view.filter !== 'all' || String(view.term || '').trim() !== '';
        const shown = filtered
            ? new Set(selectWines(allWines, { filter: view.filter, term: view.term, year: currentYear }))
            : null;
        const fragment = document.createDocumentFragment();
        const widest = Math.max(...rackShapes.map((shape) => shape.cols));
        rackShapes.forEach((shape) => fragment.appendChild(buildRack(shape, shown, widest)));
        fragment.appendChild(buildLegend());
        map.replaceChildren(fragment);
    }

    function render() {
        renderMap();
        const list = document.getElementById('list');
        const status = document.getElementById('status');
        const shown = sortWines(
            selectWines(allWines, { filter: view.filter, term: view.term, year: currentYear }),
            view.sort,
            view.direction
        );

        // One fragment, one insertion: a 1,000-bottle cellar reflows once.
        const fragment = document.createDocumentFragment();
        shown.forEach((wine) => fragment.appendChild(buildBottle(wine)));
        list.replaceChildren(fragment);

        if (status) {
            status.textContent = shown.length ? '' : 'No wines match this filter.';
            status.style.display = shown.length ? 'none' : 'block';
        }
    }

    function renderCounts() {
        const counts = filterCounts(allWines, currentYear);
        document.querySelectorAll('#chips .count').forEach((node) => {
            const key = node.getAttribute('data-count');
            node.textContent = key in counts ? String(counts[key]) : '';
        });
    }

    function setFilter(name) {
        view.filter = name;
        document.querySelectorAll('#chips .chip').forEach((chip) => {
            chip.setAttribute(
                'aria-pressed', chip.getAttribute('data-filter') === name ? 'true' : 'false'
            );
        });
        render();
    }

    function wire() {
        const search = document.getElementById('search');
        if (search) {
            search.addEventListener('input', () => {
                view.term = search.value;
                render();
                syncRacks();
            });
        }

        document.querySelectorAll('#chips .chip').forEach((chip) => {
            chip.addEventListener('click', () => {
                setFilter(chip.getAttribute('data-filter'));
                syncRacks();
            });
        });

        const sort = document.getElementById('sort');
        if (sort) {
            sort.addEventListener('change', () => { view.sort = sort.value; render(); });
        }

        const toggle = document.getElementById('light-racks');
        if (toggle) {
            toggle.setAttribute('aria-pressed', lightRacks ? 'true' : 'false');
            toggle.addEventListener('click', () => {
                lightRacks = !lightRacks;
                toggle.setAttribute('aria-pressed', lightRacks ? 'true' : 'false');
                try {
                    localStorage.setItem(LIGHT_RACKS_KEY, lightRacks ? 'on' : 'off');
                } catch (e) { /* storage unavailable: the choice lasts this visit */ }
                if (lightRacks) {
                    syncRacks();
                } else {
                    // Switching it off hands the racks back to the overview.
                    clearTimeout(rackTimer);
                    callService('show_overview', {});
                }
            });
        }

        const mapToggle = document.getElementById('map-toggle');
        if (mapToggle) {
            mapToggle.setAttribute('aria-pressed', mapOpen ? 'true' : 'false');
            mapToggle.addEventListener('click', () => {
                mapOpen = !mapOpen;
                mapToggle.setAttribute('aria-pressed', mapOpen ? 'true' : 'false');
                try {
                    localStorage.setItem(RACK_MAP_KEY, mapOpen ? 'open' : 'closed');
                } catch (e) { /* storage unavailable: the choice lasts this visit */ }
                renderMap();
            });
        }

        const direction = document.getElementById('direction');
        if (direction) {
            direction.addEventListener('click', () => {
                view.direction = view.direction === 'asc' ? 'desc' : 'asc';
                direction.textContent = view.direction === 'asc' ? '▲' : '▼';
                render();
            });
        }
    }

    // Replaces the cellar and redraws, leaving `view` alone - so a refresh
    // keeps the chip, the search term and the sort the user had chosen.
    function loadWines(rows) {
        allWines = (rows || []).map(normaliseWine);
        renderCounts();
        render();
    }

    wire();

    Promise.all([
        fetchJson('inventory'),
        fetchJson('settings').catch(() => ({ currency: 'USD', currency_symbol: '$' }))
    ])
        .then(([data, settings]) => {
            currencySymbol = settings.currency_symbol || settings.currency || '$';
            ledRacks = Array.isArray(settings.racks) ? settings.racks.map(String) : [];
            const toggle = document.getElementById('light-racks');
            if (toggle) toggle.hidden = ledRacks.length === 0;
            rackShapes = (Array.isArray(settings.rack_shapes) ? settings.rack_shapes : [])
                .filter((shape) => shape && Number(shape.rows) > 0 && Number(shape.cols) > 0)
                .map((shape) => ({
                    location: String(shape.location),
                    rows: Math.min(26, Number(shape.rows)),
                    cols: Math.min(255, Number(shape.cols)),
                    missing: Array.isArray(shape.missing) ? shape.missing : [],
                }));
            const mapToggle = document.getElementById('map-toggle');
            if (mapToggle) mapToggle.hidden = rackShapes.length === 0;
            loadWines(data);
        })
        .catch((err) => {
            const status = document.getElementById('status');
            if (status) {
                // textContent, never innerHTML: the message embeds server data.
                status.textContent = err.message || 'Error loading data.';
            }
            console.error(err);
        });
</script>
</body>
</html>
