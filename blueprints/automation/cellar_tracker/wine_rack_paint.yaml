blueprint:
  name: "CellarTracker: paint a wine rack"
  description: >-
    Keeps one wine rack's LEDs showing the cellar. It sends the rack's grid
    sensor to the rack's ESPHome LED boards whenever the grid changes, after
    every CellarTracker sync, after Home Assistant starts, and when a board
    comes back from a reboot or power cut.


    It also lights the rack from the CellarTracker dashboard: tapping a bottle
    lights its bin, and a filter or a search lights only the matching bins.
    With "Turn the racks off after" set in the integration's options, the
    rack goes dark that long after the last request and stays dark until the
    next one.


    Create one automation from this blueprint per rack. The rack itself is
    set up in the integration first: Settings > Devices & Services >
    CellarTracker > Configure > LED racks. That is what creates the
    "<rack> grid" sensor picked below.


    The boards are the ESPHome configurations in the repository's
    examples/esphome folder, or anything else that declares the same
    light_rack action.
  domain: automation
  author: GuvHas
  homeassistant:
    min_version: "2024.11.0"
  source_url: https://github.com/GuvHas/cellartracker/blob/main/blueprints/automation/cellar_tracker/wine_rack_paint.yaml
  input:
    grid_sensor:
      name: Rack grid sensor
      description: The CellarTracker "<rack> grid" sensor for this rack.
      selector:
        entity:
          filter:
            - integration: cellar_tracker
              domain: sensor
    sync_sensor:
      name: Last synchronised sensor
      description: >-
        CellarTracker's "Last synchronised" sensor. The rack is repainted after
        every sync, so a rack turned off with the controls script comes back
        even when no bottle has moved.
      selector:
        entity:
          filter:
            - integration: cellar_tracker
              domain: sensor
              device_class: timestamp
    nodes:
      name: ESPHome node names
      description: >-
        The ESPHome name of every board on this rack, as in the board's YAML
        (device_name), separated by commas. For the example racks that is
        "winerack1aled, winerack1bled" for rack 1 and "winerack2led" for
        rack 2. Every board gets the whole grid and paints only its own rows.
      selector:
        text:
    board_lights:
      name: One light from each board
      description: >-
        Any light entity from each of the boards above, such as its row A
        light. A board's entities go unavailable while it reboots; when they
        come back, the rack is repainted.
      selector:
        entity:
          multiple: true
          filter:
            - integration: esphome
              domain: light

mode: restart

variables:
  grid_sensor: !input grid_sensor
  nodes: !input nodes
  # Which rack this automation drives, as the integration names it. The
  # dashboard's events name a rack the same way, and each rack's automation
  # answers only its own.
  rack_location: "{{ state_attr(grid_sensor, 'location') }}"
  # ESPHome registers a node's actions as esphome.<name>_<action>, with any
  # dash in the name turned into an underscore.
  # The names are typed into one box, separated by commas or spaces. A list
  # is accepted too, as automations made before the box was one still hold.
  node_names: >-
    {% set typed = nodes if nodes is string else (nodes | join(',')) %}
    {{ (typed | replace(',', ' ')).split() | map('lower')
       | map('replace', '-', '_') | list }}

triggers:
  # to: null - the state, not its attributes: the grid sensor's "showing"
  # attribute changes with every dashboard request, and is not a reason to
  # repaint.
  - trigger: state
    entity_id: !input grid_sensor
    to: null
    id: grid
  # Every sync, too, even when the grid has not changed: an unchanged grid
  # fires no state change, and without this a rack that was turned off would
  # stay dark until a bottle moved.
  - trigger: state
    entity_id: !input sync_sensor
    to: null
    id: synced
  # A board forgets everything it was showing when it reboots, and its
  # entities go unavailable and back while it does.
  - trigger: state
    entity_id: !input board_lights
    from: unavailable
    id: reconnected
  - trigger: homeassistant
    event: start
    id: reconnected
  # From the dashboard, through the integration's locate_bottle,
  # highlight_bottles and show_overview actions.
  - trigger: event
    event_type: cellartracker_rack_locate
    id: locate
  - trigger: event
    event_type: cellartracker_rack_paint
    id: dashboard

conditions:
  - condition: template
    value_template: >-
      {{ trigger.platform != 'event' or trigger.event.data.location == rack_location }}
  - condition: template
    value_template: "{{ states(grid_sensor) not in ['unknown', 'unavailable', ''] }}"

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: locate
        sequence:
          # Anyone who can fire an event can fire this one, so it is checked
          # before it reaches a board: a bin id, as the integration sends it.
          - condition: template
            value_template: >-
              {{ trigger.event.data.bin is string
                 and trigger.event.data.bin is match('^[A-Za-z][0-9]{1,3}$') }}
          # Every board gets it: the one holding the bin lights it, the others
          # go dark. [0, 0, 0] is the board's own locator colour.
          - repeat:
              for_each: "{{ node_names }}"
              sequence:
                - action: "esphome.{{ repeat.item }}_light_bin"
                  continue_on_error: true
                  data:
                    bin_id: "{{ trigger.event.data.bin }}"
                    r: 0
                    g: 0
                    b: 0
                    seconds: "{{ [[trigger.event.data.seconds | int(120), 0] | max, 3600] | min }}"

      - conditions:
          - condition: trigger
            id: dashboard
        sequence:
          # One known state per bin, the same size as the rack's own grid.
          - condition: template
            value_template: >-
              {{ trigger.event.data.grid is string
                 and trigger.event.data.grid | length == states(grid_sensor) | length
                 and trigger.event.data.grid is match('^[.NARUP]*$') }}
          # A highlight or an overview asked for on purpose replaces a running
          # locator, which only clear_all cancels.
          - repeat:
              for_each: "{{ node_names }}"
              sequence:
                - action: "esphome.{{ repeat.item }}_clear_all"
                  continue_on_error: true
                  data: {}
          - repeat:
              for_each: "{{ node_names }}"
              sequence:
                - action: "esphome.{{ repeat.item }}_light_rack"
                  continue_on_error: true
                  data:
                    grid: "{{ trigger.event.data.grid }}"

    default:
      # Only over the overview. A rack that went dark after being left alone
      # stays dark, and a highlight someone is looking at is not wiped by a
      # sync. "showing" is missing on versions before it existed: repaint.
      - condition: template
        value_template: >-
          {{ state_attr(grid_sensor, 'showing') not in ['off', 'highlight'] }}
      - if:
          - condition: trigger
            id: reconnected
        then:
          # Give the board's API a moment to accept actions after it reconnects.
          - delay: "00:00:05"
      # The same grid goes to every board on the rack, one after the other. The
      # boards keep a running locator on top of it, so a repaint that lands
      # while you are looking for a bottle does not steal the answer.
      - repeat:
          for_each: "{{ node_names }}"
          sequence:
            - action: "esphome.{{ repeat.item }}_light_rack"
              continue_on_error: true
              data:
                grid: "{{ states(grid_sensor) }}"
