# Wine rack 2 - bin lighting for the CellarTracker integration
# =============================================================================
#
# The second rack: a plain 7 x 7, rows A-G and bins 1-7, 49 bins. Its own
# ESP32, because it is a separate piece of furniture - a data line running
# between two racks is exactly the long unshielded run that goes wrong, and
# two nodes means either rack can be worked on without darkening the other.
#
# Everything else is rack 1's design at a smaller size: one WS2815 strand per
# bin row, mounted horizontally along the back of the rack and fed from the
# bin-1 end, the same action surface, the same state characters, the same
# palette. See examples/esphome/winerack1aled.yaml for the reasoning behind the
# horizontal strips and the 12 V rail; only the numbers and the driver differ
# here. A full rectangle has no opening, so no row here needs a jumper.
#
# This node is wired for a **Lightish E8-WiFi Plus**: eight buffered 5 V TTL
# outputs with per-port fuses, power and data on one connector each. See
# examples/HARDWARE.md for the parts list, the pin map and why port O2 is left
# empty.
#
# Actions exposed to Home Assistant:
#
#   esphome.winerack2led_light_rack   grid: 49 state characters, row-major
#   esphome.winerack2led_light_row    row: "A".."G", states: 7 characters
#   esphome.winerack2led_light_bin    bin_id: "C4", r/g/b: 0-255, seconds: hold
#   esphome.winerack2led_clear_all    turn everything off
#
# State characters: R ready, U drink this year, P past window, A needs aging,
# N no window recorded, . empty.
#
# -----------------------------------------------------------------------------
# Before you flash this
# -----------------------------------------------------------------------------
#
# 1. Secrets. Your ESPHome secrets.yaml needs these, alongside rack 1's:
#
#      wifi_ssid / wifi_password / wifi_domain   shared with rack 1's nodes
#      winerack2led_api_key:       `esphome generate-encryption-key`
#      winerack2led_ota_password:  anything long and random
#      winerack2led_ap_ssid:       the fallback hotspot's name
#      winerack2led_ap_password:   and its password, 8 characters or more
#
#    Generate rack 2 its own key and password rather than reusing rack 1's.
#
# 2. Power. All 280 pixels sit behind a bin and can be lit at once:
#
#      everything off ............................  0.3 A   (3 W)
#      every bin ready (0, 110, 0) ...............  1.3 A
#      every bin drink-this-year (150, 55, 0) ....  2.2 A   <- the worst case
#      per strand, at that worst case ............  0.3 A
#
#    One 12 V 16 A supply runs both racks - rack 1's 5.7 A plus this 2.2 A is
#    7.8 A, or 49 % load on a Mean Well XLG-200-12. Fuse each strand at 2 A,
#    not the 5 A the controller ships with: the fuse is there to protect
#    0.42 mm2 cable, and 5 A does not.
#
#    The controller's own spec asks for a supply able to deliver at least
#    10 A. That is not about the LEDs - it is so a shorted output blows its
#    fuse instead of making the supply current-limit, which would drop the
#    whole rack rather than one row.
#
# 3. Seven strands is inside the ESP32's eight RMT channels, so this node uses
#    `esp32_rmt_led_strip` on ESP-IDF and needs no Arduino framework. Rack 1
#    is the same board twice - rows A-G and rows H-M - for the same reason.
#
# 4. LED power. GPIO23 drives an external relay that cuts the 12 V rail when
#    every bin is dark. See the `switch:` block below - and note the bigger
#    lever is not lighting the rack when nobody is in the cellar at all.
#
# =============================================================================

substitutions:
  device_name: winerack2led
  friendly_name: Wine Rack 2

  # --- Rack geometry -------------------------------------------------------
  # A full 7 x 7, so every row is the same length - no U here.
  rack_rows: "7" # rows A..G, one strand each
  rack_cols: "7" # bin columns 1..7
  rack_cells: "49" # rack_rows * rack_cols
  bin_width_mm: "95" # one bin, wall to wall - the same bins as rack 1
  strip_density: "60" # LEDs per metre, cut line to cut line
  strand_leds: "40" # 7 bins: the LEDs whose centres fall inside 7 * 95 mm

  # --- The coordinate map --------------------------------------------------
  # Everything from here to `redraw_interval` is C++, pasted into the lambdas
  # that need it. There is one copy and this is it: tests/cpp lifts these exact
  # characters out of this file and compiles them under doctest, so what the
  # tests prove is literally what the board runs. Retyping any of it into a
  # lambda below would put that guarantee back where it was.

  # The rack's shape: {first column, bins, first column, bins} per bin row -
  # see rack 1 for the format. A rectangle, so every row is one unbroken piece
  # of seven bins - which is what makes rack 1's U the interesting case and
  # this one the control.
  rack_table: >-
    {0, 7, 0, 0}, {0, 7, 0, 0}, {0, 7, 0, 0}, {0, 7, 0, 0},
    {0, 7, 0, 0}, {0, 7, 0, 0}, {0, 7, 0, 0}

  # Which bins row kRow carries. A strand only has to say which row it is; the
  # table above answers the rest. `static const` puts it in flash.
  row_extent: |-
    static const int kTable[${rack_rows}][4] = {${rack_table}};
    const bool kKnown = kRow >= 0 && kRow < ${rack_rows};
    const int kFirstA = kKnown ? kTable[kRow][0] : 0;
    const int kBinsA = kKnown ? kTable[kRow][1] : 0;
    const int kFirstB = kKnown ? kTable[kRow][2] : 0;
    const int kBinsB = kKnown ? kTable[kRow][3] : 0;

  # The first LED of bin column `col` on a strand made of piece A (`bins_a`
  # bins from column `first_a`) and then piece B, or -1 for a column this row
  # does not have. When `count` is not null it gets how many LEDs that bin
  # owns - 5 or 6 on this rack.
  #
  # DIN enters at the COLUMN-1 END of every row, so bin 1 is pixel 0 and the
  # bin numbers count up along the strand. Every row's feed comes up one
  # riser at the side of the rack instead of crossing the back.
  #
  # Bins are placed by where they physically are, not by a whole number of
  # LEDs each. A bin is `bin_width_mm` wide and the strip has `strip_density`
  # LEDs per metre, so at 95 mm and 60/m a bin is 5.7 LEDs. A fixed 6 per bin
  # would be 4 LEDs - 65 mm - out by bin 13; instead `edge(k)` is the first
  # LED whose centre lies past the k-th bin wall of a piece, which is
  # ceil(k * width * density / 1000 - 1/2) in integers. A bin owns the LEDs
  # between its two walls, so the error never exceeds half an LED.
  #
  # Each piece is cut at its first bin's wall, so piece B is aligned to bin 10
  # on its own and starts on the pixel after piece A's last. The jumper across
  # the U's opening carries data and power but no pixels, so its length does
  # not enter the arithmetic.
  #
  # The range checks are what keep a column in the opening - bin 7 on row A -
  # from landing on a plausible pixel of either piece.
  bin_first_led: |-
    auto bin_first_led = [](int col, int first_a, int bins_a, int first_b, int bins_b,
                            int *count) -> int {
      auto edge = [](int k) -> int {
        return (2 * k * ${bin_width_mm} * ${strip_density} + 999) / 2000;
      };
      int offset = 0;
      int k = -1;
      if (bins_a > 0 && col >= first_a && col < first_a + bins_a) {
        k = col - first_a;
      } else if (bins_b > 0 && col >= first_b && col < first_b + bins_b) {
        offset = bins_a > 0 ? edge(bins_a) : 0;
        k = col - first_b;
      }
      if (k < 0) return -1;
      if (count != nullptr) *count = edge(k + 1) - edge(k);
      return offset + edge(k);
    };

  # Read a bin id like "A7" into a zero-indexed column and row. Accepts the
  # ways a bin gets written down by hand and by CellarTracker: lower case, a
  # leading zero, and a space, dash or underscore between letter and number.
  #
  # Hand-rolled rather than sscanf: it has to reject "12A" and "A1B", which a
  # scanf format quietly accepts by stopping early. Not isdigit() either, whose
  # argument is an int that must be representable as unsigned char - a signed
  # char above 127 is undefined behaviour there.
  parse_bin_id: |-
    auto parse_bin_id = [](const char *bin_id, int *column, int *row) -> bool {
      if (bin_id == nullptr || column == nullptr || row == nullptr) return false;
      const char *p = bin_id;
      while (*p == ' ' || *p == '\t') p++;
      char letter = *p;
      if (letter >= 'a' && letter <= 'z') letter = (char) (letter - ('a' - 'A'));
      if (letter < 'A' || letter > 'Z') return false;
      p++;
      int number = 0;
      bool any_digit = false;
      for (; *p != '\0'; p++) {
        const char ch = *p;
        if (ch >= '0' && ch <= '9') {
          number = number * 10 + (ch - '0');
          any_digit = true;
        } else if (ch == ' ' || ch == '\t' || ch == '-' || ch == '_') {
          continue;
        } else {
          return false;
        }
      }
      if (!any_digit || number < 1) return false;
      *row = letter - 'A';
      *column = number - 1;
      return true;
    };

  # Paint one strand from cell_rgb. Needs kRow, and row_extent and
  # bin_first_led declared ahead of it.
  paint_row: |-
    for (int i = 0; i < it.size(); i++) it[i] = Color(0, 0, 0);
    for (int col = 0; col < ${rack_cols}; col++) {
      int leds = 0;
      const int base = bin_first_led(col, kFirstA, kBinsA, kFirstB, kBinsB, &leds);
      if (base < 0) continue;
      const uint8_t *rgb = &id(cell_rgb)[(kRow * ${rack_cols} + col) * 3];
      for (int i = 0; i < leds && base + i < it.size(); i++)
        it[base + i] = Color(rgb[0], rgb[1], rgb[2]);
    }

  redraw_interval: 200ms

  # --- Palette -------------------------------------------------------------
  # Identical to rack 1. Two racks that disagreed about what amber means would
  # be worse than no colour at all.
  colour_ready: "0, 110, 0" # dashboard --status-green
  colour_urgent: "150, 55, 0" # dashboard --status-amber
  colour_past: "140, 0, 0" # dashboard --status-red
  colour_aging: "0, 45, 120" # dashboard --accent-color
  colour_no_window: "35, 35, 35" # dashboard --status-grey
  colour_locate: "150, 120, 0" # the locator, when the caller passes r=g=b=0

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # No `includes:`. The coordinate map is the ${...} C++ in the substitutions
  # above, so this node is one file with nothing beside it to copy or forget.

esp32:
  board: esp32dev
  framework:
    # Seven strands fits inside the ESP32's eight RMT channels, so this node
    # uses esp32_rmt_led_strip and needs no Arduino - as do both halves of
    # rack 1.
    type: esp-idf

logger:

api:
  encryption:
    key: !secret winerack2led_api_key

  actions:
    - action: light_rack
      variables:
        grid: string
      then:
        - lambda: |-
            for (int i = 0; i < ${rack_cells}; i++) {
              id(cell_state)[i] = i < (int) grid.length() ? (uint8_t) toupper(grid[i]) : (uint8_t) '.';
            }
        - script.execute: render

    - action: light_row
      variables:
        row: string
        states: string
      then:
        - lambda: |-
            if (row.empty()) {
              ESP_LOGW("winerack", "light_row: no row given");
              return;
            }
            const int r = toupper(row[0]) - 'A';
            if (r < 0 || r >= ${rack_rows}) {
              ESP_LOGW("winerack", "light_row: '%s' is not a row between A and G", row.c_str());
              return;
            }
            for (int c = 0; c < ${rack_cols}; c++) {
              id(cell_state)[r * ${rack_cols} + c] =
                  c < (int) states.length() ? (uint8_t) toupper(states[c]) : (uint8_t) '.';
            }
        - script.execute: render

    - action: light_bin
      variables:
        bin_id: string
        r: int
        g: int
        b: int
        seconds: int
      then:
        - lambda: |-
            ${parse_bin_id}
            int col = 0, row = 0;
            if (!parse_bin_id(bin_id.c_str(), &col, &row)) {
              ESP_LOGW("winerack", "light_bin: '%s' is not a bin id", bin_id.c_str());
              return;
            }
            const int kRow = row;
            ${row_extent}
            ${bin_first_led}
            if (bin_first_led(col, kFirstA, kBinsA, kFirstB, kBinsB, nullptr) < 0) {
              ESP_LOGW("winerack", "light_bin: '%s' is not a bin in this rack", bin_id.c_str());
              return;
            }
            const Color fallback(${colour_locate});
            id(locate_cell) = row * ${rack_cols} + col;
            id(locate_r) = (r | g | b) ? r : fallback.r;
            id(locate_g) = (r | g | b) ? g : fallback.g;
            id(locate_b) = (r | g | b) ? b : fallback.b;
        - script.execute: render
        - if:
            condition:
              lambda: 'return seconds > 0;'
            then:
              - script.execute:
                  id: hold_locator
                  duration: !lambda 'return seconds;'
            else:
              - script.stop: hold_locator

    - action: clear_all
      then:
        - script.stop: hold_locator
        - lambda: |-
            for (int i = 0; i < ${rack_cells}; i++) id(cell_state)[i] = (uint8_t) '.';
            id(locate_cell) = -1;
        - script.execute: render

ota:
  - platform: esphome
    password: !secret winerack2led_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret wifi_domain

  ap:
    ssid: !secret winerack2led_ap_ssid
    password: !secret winerack2led_ap_password

captive_portal:

# --- STATE -------------------------------------------------------------------
globals:
  - id: cell_state
    type: uint8_t[49] # rack_cells
    restore_value: false

  - id: cell_rgb
    type: uint8_t[147] # rack_cells * 3
    restore_value: false

  - id: locate_cell
    type: int
    restore_value: false
    initial_value: '-1'

  - id: locate_r
    type: int
    restore_value: false
    initial_value: '0'
  - id: locate_g
    type: int
    restore_value: false
    initial_value: '0'
  - id: locate_b
    type: int
    restore_value: false
    initial_value: '0'

# --- LED POWER ---------------------------------------------------------------
# The E8-WiFi Plus brings its relay control out on GPIO23. The board expects a
# secondary feed to keep the ESP32 alive while the relay cuts the main 12 V
# rail, so the node stays on the network with every pixel dead.
#
# That is worth having because a WS2815 draws about 1 mA just being powered:
# 280 pixels is 0.3 A, or 3 W, burnt continuously to show nothing. The render
# script raises this whenever any bin is lit and drops it when the rack goes
# dark.
#
# With no relay fitted this toggles a pin and does nothing, which is harmless.
# `internal: true` keeps it out of Home Assistant - it is a consequence of the
# picture, not something to switch by hand. Turning it off under a lit rack
# would simply blank the LEDs until the next redraw turned it back on.
switch:
  - platform: gpio
    id: led_power
    pin: GPIO23
    internal: true
    restore_mode: ALWAYS_OFF

# --- RENDERING ---------------------------------------------------------------
script:
  - id: render
    mode: restart
    then:
      - lambda: |-
          auto colour_of = [](uint8_t state) -> Color {
            switch (state) {
              case 'R': return Color(${colour_ready});
              case 'U': return Color(${colour_urgent});
              case 'P': return Color(${colour_past});
              case 'A': return Color(${colour_aging});
              case 'N': return Color(${colour_no_window});
              default:  return Color(0, 0, 0);
            }
          };

          const int located = id(locate_cell);
          for (int i = 0; i < ${rack_cells}; i++) {
            Color c(0, 0, 0);
            if (located >= 0) {
              if (i == located)
                c = Color(id(locate_r), id(locate_g), id(locate_b));
            } else {
              c = colour_of(id(cell_state)[i]);
            }
            id(cell_rgb)[i * 3] = c.r;
            id(cell_rgb)[i * 3 + 1] = c.g;
            id(cell_rgb)[i * 3 + 2] = c.b;
          }

          esphome::light::LightState *strand[${rack_rows}] = {
            id(row_a), id(row_b), id(row_c), id(row_d),
            id(row_e), id(row_f), id(row_g),
          };

          bool any_lit = false;
          for (int r = 0; r < ${rack_rows}; r++) {
            bool lit = false;
            for (int c = 0; c < ${rack_cols} && !lit; c++) {
              const uint8_t *rgb = &id(cell_rgb)[(r * ${rack_cols} + c) * 3];
              lit = rgb[0] || rgb[1] || rgb[2];
            }
            any_lit = any_lit || lit;
            if (lit) {
              auto call = strand[r]->turn_on();
              call.set_effect("Rack");
              call.perform();
            } else {
              strand[r]->turn_off().perform();
            }
          }

          // Power the strips before they are asked to show anything, and cut
          // the rail only once the whole rack is dark. The effect repaints
          // every ${redraw_interval}, so a strand that was unpowered a moment
          // ago is repainted within one interval of the relay closing.
          if (any_lit) {
            id(led_power).turn_on();
          } else {
            id(led_power).turn_off();
          }

  - id: hold_locator
    mode: restart
    parameters:
      duration: int
    then:
      - delay: !lambda 'return duration * 1000;'
      - lambda: 'id(locate_cell) = -1;'
      - script.execute: render

# --- STRANDS -----------------------------------------------------------------
# Seven identical rows, bins 1 to 7, mounted horizontally along the back of the
# rack. Feed and data enter at the BIN-1 END of each row, so pixel 0 is bin 1
# and the bin numbers count up along the strand.
#
# One literal per strand: which bin row it is. The three substitutions after
# it are the coordinate map, shared character for character with rack 1.
#
# The pins are the E8-WiFi Plus's ports, which are fixed in copper:
#
#   row A -> O2 (GPIO12)   row E -> O6 (GPIO26)
#   row B -> O3 (GPIO4)    row F -> O7 (GPIO33)
#   row C -> O4 (GPIO27)   row G -> O8 (GPIO25)
#   row D -> O5 (GPIO17)
#
# O1 (GPIO5) is empty because the port on this board is damaged (2026-10-26),
# so row A moved to the other half of the same X1 terminal block, O2.
#
# O2 (GPIO12) was the port we meant to skip. GPIO12 is MTDI, which selects
# flash voltage at reset: held high, a 3.3 V module does not boot at all. On
# this board it only drives the port's buffer, a high-impedance input, so
# nothing on the cable side can pull it up, and the pin's own pull-down holds
# it low at reset. With O1 dead it is seven strands into seven ports, so the
# risk is taken. If the board ever refuses to boot, burning the flash-voltage
# eFuse to 3.3 V (examples/HARDWARE.md) makes GPIO12 an ordinary pin for good.
# tests/test_rack_leds_example.py records that compromise explicitly rather
# than letting it pass unnoticed.
#
# Rows descend the rack as the ports ascend, so the bundle that comes up the
# riser peels off one cable per shelf in port order instead of crossing over
# itself. Nothing about the picture depends on it - every `kRow` still names
# the bin row its entity is called after.
.strand: &strand
  # Seven strands fits the ESP32's eight RMT channels, so this is the native
  # ESP-IDF driver, the same as both halves of rack 1.
  platform: esp32_rmt_led_strip
  # WS2815 - 12 V, with the backup data line that keeps a row alive when one
  # pixel dies. It speaks the WS2812 protocol, which is the name this component
  # knows. Tie the first pixel's BI pad alongside its DI.
  chipset: WS2812
  # This strip takes its colours red, green, blue - not the GRB a WS2812B
  # does. Measured on rack 2's first row: with GRB, red from Home Assistant
  # lit green. `channel_colors` replaces the deprecated `rgb_order`.
  channel_colors: RGB
  # One 64-symbol RMT memory block per strand. A classic ESP32 has eight of
  # them, 512 symbols in all, and ESPHome's default of 192 takes three blocks
  # per strand - so only two strands start and the rest are marked FAILED at
  # boot. At 64 every strand fits in its own block; the driver refills it from
  # an interrupt as the frame goes out.
  rmt_symbols: 64
  num_leds: ${strand_leds}
  restore_mode: ALWAYS_OFF
  default_transition_length: 0s
  gamma_correct: 1.0

light:
  - <<: *strand
    id: row_a
    name: "Row A"
    pin: GPIO12
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kRow = 0;
            ${row_extent}
            ${bin_first_led}
            ${paint_row}

  - <<: *strand
    id: row_b
    name: "Row B"
    pin: GPIO4
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kRow = 1;
            ${row_extent}
            ${bin_first_led}
            ${paint_row}

  - <<: *strand
    id: row_c
    name: "Row C"
    pin: GPIO27
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kRow = 2;
            ${row_extent}
            ${bin_first_led}
            ${paint_row}

  - <<: *strand
    id: row_d
    name: "Row D"
    pin: GPIO17
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kRow = 3;
            ${row_extent}
            ${bin_first_led}
            ${paint_row}

  - <<: *strand
    id: row_e
    name: "Row E"
    pin: GPIO26
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kRow = 4;
            ${row_extent}
            ${bin_first_led}
            ${paint_row}

  - <<: *strand
    id: row_f
    name: "Row F"
    pin: GPIO33
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kRow = 5;
            ${row_extent}
            ${bin_first_led}
            ${paint_row}

  - <<: *strand
    id: row_g
    name: "Row G"
    pin: GPIO25
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kRow = 6;
            ${row_extent}
            ${bin_first_led}
            ${paint_row}
