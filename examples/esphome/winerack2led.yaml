# Wine rack 2 - bin lighting for the CellarTracker integration
# =============================================================================
#
# The second rack: a plain 7 x 7, rows A-G and bins 1-7, 49 bins. Its own
# ESP32, because it is a separate piece of furniture - a data line running
# between two racks is exactly the long unshielded run that goes wrong, and
# two nodes means either rack can be worked on without darkening the other.
#
# Everything else is rack 1's design at a smaller size: one WS2815 strand per
# bin column fed from the floor, the same action surface, the same state
# characters, the same palette. See examples/esphome/winerack1led.yaml for the
# reasoning behind the vertical strips, the FastLED driver and the 12 V rail;
# only the numbers differ here.
#
# Actions exposed to Home Assistant:
#
#   esphome.winerack2led_light_rack   grid: 49 state characters, row-major
#   esphome.winerack2led_light_row    row: "A".."G", states: 7 characters
#   esphome.winerack2led_light_bin    bin_id: "C4", r/g/b: 0-255, seconds: hold
#   esphome.winerack2led_clear_all    turn everything off
#
# State characters: R ready, U drink this year, P past window, A needs aging,
# N no window recorded, . empty.
#
# -----------------------------------------------------------------------------
# Before you flash this
# -----------------------------------------------------------------------------
#
# 1. Secrets. Your ESPHome secrets.yaml needs these, alongside rack 1's:
#
#      wifi_ssid / wifi_password / wifi_domain   shared with rack 1
#      winerack2led_api_key:       `esphome generate-encryption-key`
#      winerack2led_ota_password:  anything long and random
#      winerack2led_ap_ssid:       the fallback hotspot's name
#      winerack2led_ap_password:   and its password, 8 characters or more
#
#    Generate rack 2 its own key and password rather than reusing rack 1's.
#
# 2. Power. 49 bins x 6 LEDs is 294 pixels lit at once out of 420 powered:
#
#      everything off ............................  0.4 A   (5 W)
#      every bin ready (0, 110, 0) ...............  1.5 A
#      every bin drink-this-year (150, 55, 0) ....  2.4 A   <- the worst case
#      per strand, at that worst case ............  0.4 A
#
#    A 12 V 3 A supply covers this rack on its own, with a 5 A fuse on an
#    18 AWG feed. If the two racks are close enough to share a bus, one 12 V
#    12.5 A supply runs both - rack 1's 6.3 A plus this 2.4 A is 8.7 A - but
#    each node still wants its own 12 V -> 5 V buck for its logic.
#
# 3. Seven strands is inside the ESP32's eight RMT channels, so this node
#    would also work with `esp32_rmt_led_strip` under ESP-IDF. It is left on
#    FastLED to match rack 1: one thing to learn, one thing to debug.
#
# =============================================================================

substitutions:
  device_name: winerack2led
  friendly_name: Wine Rack 2

  # --- Rack geometry -------------------------------------------------------
  # A full 7 x 7, so every column is the same height - no U here.
  rack_rows: "7" # rows A..G
  rack_cols: "7" # bin columns 1..7, one strand each
  rack_cells: "49" # rack_rows * rack_cols
  bin_leds: "6" # LEDs lit in front of one bin
  bin_pitch: "9" # LEDs from the start of one bin to the start of the next
  strand_leds: "60" # 7 bins: 7 * 9 - 3, the last bin has no gap after it

  # --- The coordinate map --------------------------------------------------
  # Everything from here to `redraw_interval` is C++, pasted into the lambdas
  # that need it. There is one copy and this is it: tests/cpp lifts these exact
  # characters out of this file and compiles them under doctest, so what the
  # tests prove is literally what the board runs. Retyping any of it into a
  # lambda below would put that guarantee back where it was.

  # The rack's shape: {first row, bins} per bin column. A rectangle, so
  # every column is the same - which is what makes rack 1's U the
  # interesting case and this one the control.
  rack_table: >-
    {0, 7}, {0, 7}, {0, 7}, {0, 7}, {0, 7}, {0, 7}, {0, 7}

  # Which bins column kCol carries. A strand only has to say which column it
  # is; the table above answers the rest. `static const` puts it in flash.
  column_extent: |-
    static const int kTable[${rack_cols}][2] = {${rack_table}};
    const int kFirst = (kCol >= 0 && kCol < ${rack_cols}) ? kTable[kCol][0] : 0;
    const int kBins = (kCol >= 0 && kCol < ${rack_cols}) ? kTable[kCol][1] : 0;

  # The first LED of `row` on a strand carrying `bins` bins from row `first`,
  # or -1 for a row this column does not have.
  #
  # DIN enters at the FLOOR and the strip runs upward, so the column's LOWEST
  # bin is pixel 0 and the row letters count backwards from there. That is the
  # whole reason the thirteen feeds sit in a line along the bottom of the rack
  # where a skirting board hides them, instead of thirteen wires coming over
  # the top of it.
  #
  # `first + bins - 1` is the column's own bottom row, not the envelope's. On
  # this rack they coincide - every column reaches row M - but anchoring on
  # the column is what keeps a short strand from being indexed as a tall one.
  #
  # The `row < first` guard is not decoration: without it a negative row makes
  # (first + bins - 1 - row) larger, not smaller, so an out-of-range request
  # would return a plausible index off the end of the strand rather than -1.
  bin_first_led: |-
    auto bin_first_led = [](int row, int first, int bins) -> int {
      if (bins <= 0 || row < first || row >= first + bins) return -1;
      return (first + bins - 1 - row) * ${bin_pitch};
    };

  # Read a bin id like "A7" into a zero-indexed column and row. Accepts the
  # ways a bin gets written down by hand and by CellarTracker: lower case, a
  # leading zero, and a space, dash or underscore between letter and number.
  #
  # Hand-rolled rather than sscanf: it has to reject "12A" and "A1B", which a
  # scanf format quietly accepts by stopping early. Not isdigit() either, whose
  # argument is an int that must be representable as unsigned char - a signed
  # char above 127 is undefined behaviour there.
  parse_bin_id: |-
    auto parse_bin_id = [](const char *bin_id, int *column, int *row) -> bool {
      if (bin_id == nullptr || column == nullptr || row == nullptr) return false;
      const char *p = bin_id;
      while (*p == ' ' || *p == '\t') p++;
      char letter = *p;
      if (letter >= 'a' && letter <= 'z') letter = (char) (letter - ('a' - 'A'));
      if (letter < 'A' || letter > 'Z') return false;
      p++;
      int number = 0;
      bool any_digit = false;
      for (; *p != '\0'; p++) {
        const char ch = *p;
        if (ch >= '0' && ch <= '9') {
          number = number * 10 + (ch - '0');
          any_digit = true;
        } else if (ch == ' ' || ch == '\t' || ch == '-' || ch == '_') {
          continue;
        } else {
          return false;
        }
      }
      if (!any_digit || number < 1) return false;
      *row = letter - 'A';
      *column = number - 1;
      return true;
    };

  # Paint one strand from cell_rgb. Needs kCol, and column_extent and
  # bin_first_led declared ahead of it.
  paint_column: |-
    for (int i = 0; i < it.size(); i++) it[i] = Color(0, 0, 0);
    for (int b = 0; b < kBins; b++) {
      const int row = kFirst + b;
      const int base = bin_first_led(row, kFirst, kBins);
      if (base < 0) continue;
      const uint8_t *rgb = &id(cell_rgb)[(row * ${rack_cols} + kCol) * 3];
      for (int i = 0; i < ${bin_leds} && base + i < it.size(); i++)
        it[base + i] = Color(rgb[0], rgb[1], rgb[2]);
    }

  redraw_interval: 200ms

  # --- Palette -------------------------------------------------------------
  # Identical to rack 1. Two racks that disagreed about what amber means would
  # be worse than no colour at all.
  colour_ready: "0, 110, 0" # dashboard --status-green
  colour_urgent: "150, 55, 0" # dashboard --status-amber
  colour_past: "140, 0, 0" # dashboard --status-red
  colour_aging: "0, 45, 120" # dashboard --accent-color
  colour_no_window: "35, 35, 35" # dashboard --status-grey
  colour_locate: "150, 120, 0" # the locator, when the caller passes r=g=b=0

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # No `includes:`. The coordinate map is the ${...} C++ in the substitutions
  # above, so this node is one file with nothing beside it to copy or forget.

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret winerack2led_api_key

  actions:
    - action: light_rack
      variables:
        grid: string
      then:
        - lambda: |-
            for (int i = 0; i < ${rack_cells}; i++) {
              id(cell_state)[i] = i < (int) grid.length() ? (uint8_t) toupper(grid[i]) : (uint8_t) '.';
            }
        - script.execute: render

    - action: light_row
      variables:
        row: string
        states: string
      then:
        - lambda: |-
            if (row.empty()) {
              ESP_LOGW("winerack", "light_row: no row given");
              return;
            }
            const int r = toupper(row[0]) - 'A';
            if (r < 0 || r >= ${rack_rows}) {
              ESP_LOGW("winerack", "light_row: '%s' is not a row between A and G", row.c_str());
              return;
            }
            for (int c = 0; c < ${rack_cols}; c++) {
              id(cell_state)[r * ${rack_cols} + c] =
                  c < (int) states.length() ? (uint8_t) toupper(states[c]) : (uint8_t) '.';
            }
        - script.execute: render

    - action: light_bin
      variables:
        bin_id: string
        r: int
        g: int
        b: int
        seconds: int
      then:
        - lambda: |-
            ${parse_bin_id}
            int col = 0, row = 0;
            if (!parse_bin_id(bin_id.c_str(), &col, &row)) {
              ESP_LOGW("winerack", "light_bin: '%s' is not a bin id", bin_id.c_str());
              return;
            }
            const int kCol = col;
            ${column_extent}
            ${bin_first_led}
            if (bin_first_led(row, kFirst, kBins) < 0) {
              ESP_LOGW("winerack", "light_bin: '%s' is not a bin in this rack", bin_id.c_str());
              return;
            }
            const Color fallback(${colour_locate});
            id(locate_cell) = row * ${rack_cols} + col;
            id(locate_r) = (r | g | b) ? r : fallback.r;
            id(locate_g) = (r | g | b) ? g : fallback.g;
            id(locate_b) = (r | g | b) ? b : fallback.b;
        - script.execute: render
        - if:
            condition:
              lambda: 'return seconds > 0;'
            then:
              - script.execute:
                  id: hold_locator
                  duration: !lambda 'return seconds;'
            else:
              - script.stop: hold_locator

    - action: clear_all
      then:
        - script.stop: hold_locator
        - lambda: |-
            for (int i = 0; i < ${rack_cells}; i++) id(cell_state)[i] = (uint8_t) '.';
            id(locate_cell) = -1;
        - script.execute: render

ota:
  - platform: esphome
    password: !secret winerack2led_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret wifi_domain

  ap:
    ssid: !secret winerack2led_ap_ssid
    password: !secret winerack2led_ap_password

captive_portal:

# --- STATE -------------------------------------------------------------------
globals:
  - id: cell_state
    type: uint8_t[49] # rack_cells
    restore_value: false

  - id: cell_rgb
    type: uint8_t[147] # rack_cells * 3
    restore_value: false

  - id: locate_cell
    type: int
    restore_value: false
    initial_value: '-1'

  - id: locate_r
    type: int
    restore_value: false
    initial_value: '0'
  - id: locate_g
    type: int
    restore_value: false
    initial_value: '0'
  - id: locate_b
    type: int
    restore_value: false
    initial_value: '0'

# --- RENDERING ---------------------------------------------------------------
script:
  - id: render
    mode: restart
    then:
      - lambda: |-
          auto colour_of = [](uint8_t state) -> Color {
            switch (state) {
              case 'R': return Color(${colour_ready});
              case 'U': return Color(${colour_urgent});
              case 'P': return Color(${colour_past});
              case 'A': return Color(${colour_aging});
              case 'N': return Color(${colour_no_window});
              default:  return Color(0, 0, 0);
            }
          };

          const int located = id(locate_cell);
          for (int i = 0; i < ${rack_cells}; i++) {
            Color c(0, 0, 0);
            if (located >= 0) {
              if (i == located)
                c = Color(id(locate_r), id(locate_g), id(locate_b));
            } else {
              c = colour_of(id(cell_state)[i]);
            }
            id(cell_rgb)[i * 3] = c.r;
            id(cell_rgb)[i * 3 + 1] = c.g;
            id(cell_rgb)[i * 3 + 2] = c.b;
          }

          esphome::light::LightState *strand[${rack_cols}] = {
            id(col_01), id(col_02), id(col_03), id(col_04),
            id(col_05), id(col_06), id(col_07),
          };

          for (int c = 0; c < ${rack_cols}; c++) {
            bool lit = false;
            for (int r = 0; r < ${rack_rows} && !lit; r++) {
              const uint8_t *rgb = &id(cell_rgb)[(r * ${rack_cols} + c) * 3];
              lit = rgb[0] || rgb[1] || rgb[2];
            }
            if (lit) {
              auto call = strand[c]->turn_on();
              call.set_effect("Rack");
              call.perform();
            } else {
              strand[c]->turn_off().perform();
            }
          }

  - id: hold_locator
    mode: restart
    parameters:
      duration: int
    then:
      - delay: !lambda 'return duration * 1000;'
      - lambda: 'id(locate_cell) = -1;'
      - script.execute: render

# --- STRANDS -----------------------------------------------------------------
# Seven identical columns, rows A to G. Feed and data enter at the FOOT of each
# column, so pixel 0 is row G - the bottom row - and the row letters count
# backwards up the strand from there.
#
# One literal per strand: which bin column it is. The three substitutions after
# it are the coordinate map, shared character for character with rack 1.
.strand: &strand
  platform: fastled_clockless
  # WS2815 again - 12 V with the backup data line. It speaks the WS2812B
  # protocol, which is the name ESPHome knows. Tie the first pixel's BI pad
  # alongside its DI.
  chipset: WS2812B
  rgb_order: GRB
  num_leds: ${strand_leds}
  restore_mode: ALWAYS_OFF
  default_transition_length: 0s
  gamma_correct: 1.0

light:
  - <<: *strand
    id: col_01
    name: "Column 1"
    pin: GPIO4
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kCol = 0;
            ${column_extent}
            ${bin_first_led}
            ${paint_column}

  - <<: *strand
    id: col_02
    name: "Column 2"
    pin: GPIO13
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kCol = 1;
            ${column_extent}
            ${bin_first_led}
            ${paint_column}

  # GPIO16 and GPIO17 are PSRAM on a WROVER module. Fine on a plain WROOM.
  - <<: *strand
    id: col_03
    name: "Column 3"
    pin: GPIO16
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kCol = 2;
            ${column_extent}
            ${bin_first_led}
            ${paint_column}

  - <<: *strand
    id: col_04
    name: "Column 4"
    pin: GPIO17
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kCol = 3;
            ${column_extent}
            ${bin_first_led}
            ${paint_column}

  - <<: *strand
    id: col_05
    name: "Column 5"
    pin: GPIO18
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kCol = 4;
            ${column_extent}
            ${bin_first_led}
            ${paint_column}

  - <<: *strand
    id: col_06
    name: "Column 6"
    pin: GPIO19
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kCol = 5;
            ${column_extent}
            ${bin_first_led}
            ${paint_column}

  - <<: *strand
    id: col_07
    name: "Column 7"
    pin: GPIO21
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kCol = 6;
            ${column_extent}
            ${bin_first_led}
            ${paint_column}
