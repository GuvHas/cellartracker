# Wine rack 1 - bin lighting for the CellarTracker integration
# =============================================================================
#
# A U-shaped rack: rows A-H hold bins 1-4 and 10-13 with an opening across the
# middle, and rows I-M run the full width. 129 bins in a 13 x 13 envelope.
#
# One WS2815 strand per bin ROW, mounted horizontally along the back of the
# rack and fed from the column-1 end - see note 2 for why the strips run that
# way and what happens at the U's opening. Home Assistant tells the board what
# to show; the board owns nothing but the pixels.
#
# Two things are drawn:
#
#   * The cellar overview - every bin painted with the same drinking-window
#     state the integration's dashboard paints it with, so the rack and
#     /cellartracker/cellar.html cannot tell you different things.
#   * A locator - one bin lit on its own, with everything else dark, for
#     "where is that bottle". It replaces the overview while it is showing and
#     hands it back when it times out.
#
# Actions exposed to Home Assistant (node name + action name):
#
#   esphome.winerack1led_light_rack   grid: 169 state characters, row-major
#   esphome.winerack1led_light_row    row: "A".."M", states: 13 characters
#   esphome.winerack1led_light_bin    bin_id: "A2", r/g/b: 0-255, seconds: hold
#   esphome.winerack1led_clear_all    turn everything off
#
# The action surface is unchanged by the rewiring. The grid stays row-major
# over the whole 13 x 13 envelope and bins the rack does not have are simply
# never lit - which also means a bottle CellarTracker still files at, say, A7
# quietly lights nothing, rather than lighting the wrong bin.
#
# State characters, which are the dashboard's five drinking-window states:
#
#   R  ready          - this year is inside the drinking window
#   U  urgent         - the final year of the window ("drink this year")
#   P  past           - the window closed before this year
#   A  aging          - the window has not opened yet
#   N  no window      - a bottle CellarTracker has no recommendation for
#   .  empty          - no bottle, or no bin there at all
#
# examples/home_assistant/wine_rack_leds.yaml builds those strings from the
# integration's inventory endpoint and calls the actions. The second rack has
# its own node: examples/esphome/winerack2led.yaml.
#
# -----------------------------------------------------------------------------
# Before you flash this
# -----------------------------------------------------------------------------
#
# 1. Secrets. Nothing about your network is written into this file - every
#    credential, and every name that would identify one house's network, is a
#    `!secret` reference. Your ESPHome secrets.yaml needs all seven:
#
#      wifi_ssid:                  the network to join
#      wifi_password:              its password
#      wifi_domain:                the DNS suffix to register under, leading
#                                  dot included (".iot.example.com"), or delete
#                                  the `domain:` line below if you have none
#      winerack1led_api_key:       `esphome generate-encryption-key`
#      winerack1led_ota_password:  anything long and random
#      winerack1led_ap_ssid:       the fallback hotspot's name
#      winerack1led_ap_password:   and its password, 8 characters or more
#
#    Anything that was ever pasted into a chat window or committed to a
#    repository should be regenerated before it goes in there.
#
# 2. Why the strips run horizontally. The strip's holder sits behind the bins,
#    and anywhere but horizontal along the back of the rack it covers a bin's
#    opening. So: one strand per ROW, along the back.
#
#    The U puts a hole in the middle of rows A-H, which splits each of those
#    eight rows into two four-bin pieces - bins 1-4 and bins 10-13. Each split
#    row is still ONE strand: the two pieces are chained by a jumper of the
#    same 3-core cable (12 V, ground, data) across the opening, about 0.6 m.
#    The jumper has no pixels on it, so the firmware simply continues the
#    count: bin 10 is the first pixel after bin 4.
#
#      chained  - 13 strands and 13 data lines, the same as the vertical
#                 layout had, so the controller count does not change. Costs
#                 eight jumpers.
#      split    - 21 strands (16 four-bin pieces, 5 full rows) and 21 data
#                 lines, which is a third controller board for this rack.
#
#    `rack_table` below describes each row as up to two pieces in the order
#    the data reaches them, so either wiring is a table edit.
#
# 3. Why FastLED and not neopixelbus. A classic ESP32 has eight RMT channels
#    and two I2S buses to get WS2812-protocol timing from - ten strands' worth
#    of hardware for thirteen strands. That is a limit on how many can transmit
#    at once rather than on how many you can have, and it is the whole
#    difference between the two components: FastLED takes a channel per strand
#    as it goes and hands it back for the next one, so thirteen strands
#    transmit in batches, while neopixelbus pins one strand to one channel for
#    the life of the node and runs out. Its `bit_bang` fallback is not an
#    answer either - on ESP32 it does not compile.
#
#    `fastled_clockless` needs the Arduino framework, which is why `esp32:`
#    below asks for it.
#
# 4. Power. The strips are WS2815 on a 12 V rail. Budget a pixel at 0.3 W -
#    25 mA at 12 V - at full white, scaling with the sum of its channels,
#    plus about 1 mA standing for the controller and the backup-line logic:
#
#      (R + G + B) / 765 * 25 mA + 1 mA        @ 12 V
#
#    Every one of the 738 pixels sits behind a bin, so all of them can be lit
#    at once. That makes this rack:
#
#      everything off ............................  0.7 A   (9 W)
#      every bin ready (0, 110, 0) ...............  3.4 A
#      every bin drink-this-year (150, 55, 0) ....  5.7 A   <- the worst case
#      per strand, at that worst case ............  0.6 A   (a 13-bin row)
#                                                   0.4 A   (a split row)
#
#    So: a 12 V supply of 7 A for this rack alone, a 10 A fuse protecting a
#    16 AWG feed, and a single feed at the column-1 END of each row. A 1.2 m
#    strand at 0.6 A drops about 0.2 V, against the 1.5 V of budget between
#    12 V and the 10.5 V a WS2815 wants. A split row's second piece is fed
#    through its jumper and draws 0.2 A of it. Measure your strip's copper
#    before trusting that; over 1 ohm/m per rail, feed both ends.
#
#    Rack 2 adds 2.2 A. One 12 V 12.5 A supply runs both if they are close
#    enough to share a bus; otherwise give each rack its own.
#
#    The 12 V rail powers only the LEDs. The ESP32 and the level shifters run
#    from a small 12 V -> 5 V buck off the same bus, and every ground - buck
#    included - returns to the PSU terminal rather than through a strip.
#
#    The palette is what keeps those numbers modest - no channel goes above
#    150, and gamma_correct is 1.0, so these values are what the pixels
#    actually draw. Halving the palette halves everything above the 0.7 A
#    standing current.
#
# =============================================================================

substitutions:
  device_name: winerack1led
  friendly_name: Wine Rack 1

  # --- Rack geometry -------------------------------------------------------
  # The envelope is 13 x 13; which of those bins exist is decided by the
  # `rack_table` below. These are the same numbers for the parts of the config
  # that need a plain literal - `num_leds` on each light, and the array sizes
  # further down, neither of which can hold an expression.
  #
  # A bin is 95 mm wide and the strip has 60 LEDs per metre, so a bin is 5.7
  # LEDs - not a whole number, which is why `bin_first_led` places each bin by
  # its position rather than at a fixed pitch. A piece of N bins is the LEDs
  # whose centres fall inside its N * 95 mm: 23 for four bins, 74 for 13.
  rack_rows: "13" # rows A..M, one strand each
  rack_cols: "13" # bin columns 1..13
  rack_cells: "169" # rack_rows * rack_cols, the whole envelope
  bin_width_mm: "95" # one bin, wall to wall, measured along the back
  strip_density: "60" # LEDs per metre, cut line to cut line
  full_strand: "74" # 13 bins, bins 1..13   - rows I-M
  split_strand: "46" # 2 x 4 bins, 23 + 23   - rows A-H, jumpered across the U

  # --- The coordinate map --------------------------------------------------
  # Everything from here to `redraw_interval` is C++, pasted into the lambdas
  # that need it. There is one copy and this is it: tests/cpp lifts these exact
  # characters out of this file and compiles them under doctest, so what the
  # tests prove is literally what the board runs. Retyping any of it into a
  # lambda below would put that guarantee back where it was.

  # The rack's shape, one entry per bin row in row order (row A is 0, row M
  # is 12): {first column, bins, first column, bins} - the piece of strip the
  # data reaches first, then the piece after the jumper. Columns count from 0,
  # so bin 10 is column 9. A row with no jumper has {0, 0} for its second
  # piece. Rows A-H are the U's arms, two pieces each; rows I-M are its base.
  rack_table: >-
    {0, 4, 9, 4}, {0, 4, 9, 4}, {0, 4, 9, 4}, {0, 4, 9, 4},
    {0, 4, 9, 4}, {0, 4, 9, 4}, {0, 4, 9, 4}, {0, 4, 9, 4},
    {0, 13, 0, 0}, {0, 13, 0, 0}, {0, 13, 0, 0}, {0, 13, 0, 0}, {0, 13, 0, 0}

  # Which bins row kRow carries. A strand only has to say which row it is; the
  # table above answers the rest. `static const` puts it in flash.
  row_extent: |-
    static const int kTable[${rack_rows}][4] = {${rack_table}};
    const bool kKnown = kRow >= 0 && kRow < ${rack_rows};
    const int kFirstA = kKnown ? kTable[kRow][0] : 0;
    const int kBinsA = kKnown ? kTable[kRow][1] : 0;
    const int kFirstB = kKnown ? kTable[kRow][2] : 0;
    const int kBinsB = kKnown ? kTable[kRow][3] : 0;

  # The first LED of bin column `col` on a strand made of piece A (`bins_a`
  # bins from column `first_a`) and then piece B, or -1 for a column this row
  # does not have. When `count` is not null it gets how many LEDs that bin
  # owns - 5 or 6 on this rack.
  #
  # DIN enters at the COLUMN-1 END of every row, so bin 1 is pixel 0 and the
  # bin numbers count up along the strand. Every row's feed comes up one
  # riser at the side of the rack instead of crossing the back.
  #
  # Bins are placed by where they physically are, not by a whole number of
  # LEDs each. A bin is `bin_width_mm` wide and the strip has `strip_density`
  # LEDs per metre, so at 95 mm and 60/m a bin is 5.7 LEDs. A fixed 6 per bin
  # would be 4 LEDs - 65 mm - out by bin 13; instead `edge(k)` is the first
  # LED whose centre lies past the k-th bin wall of a piece, which is
  # ceil(k * width * density / 1000 - 1/2) in integers. A bin owns the LEDs
  # between its two walls, so the error never exceeds half an LED.
  #
  # Each piece is cut at its first bin's wall, so piece B is aligned to bin 10
  # on its own and starts on the pixel after piece A's last. The jumper across
  # the U's opening carries data and power but no pixels, so its length does
  # not enter the arithmetic.
  #
  # The range checks are what keep a column in the opening - bin 7 on row A -
  # from landing on a plausible pixel of either piece.
  bin_first_led: |-
    auto bin_first_led = [](int col, int first_a, int bins_a, int first_b, int bins_b,
                            int *count) -> int {
      auto edge = [](int k) -> int {
        return (2 * k * ${bin_width_mm} * ${strip_density} + 999) / 2000;
      };
      int offset = 0;
      int k = -1;
      if (bins_a > 0 && col >= first_a && col < first_a + bins_a) {
        k = col - first_a;
      } else if (bins_b > 0 && col >= first_b && col < first_b + bins_b) {
        offset = bins_a > 0 ? edge(bins_a) : 0;
        k = col - first_b;
      }
      if (k < 0) return -1;
      if (count != nullptr) *count = edge(k + 1) - edge(k);
      return offset + edge(k);
    };

  # Read a bin id like "A7" into a zero-indexed column and row. Accepts the
  # ways a bin gets written down by hand and by CellarTracker: lower case, a
  # leading zero, and a space, dash or underscore between letter and number.
  #
  # Hand-rolled rather than sscanf: it has to reject "12A" and "A1B", which a
  # scanf format quietly accepts by stopping early. Not isdigit() either, whose
  # argument is an int that must be representable as unsigned char - a signed
  # char above 127 is undefined behaviour there.
  parse_bin_id: |-
    auto parse_bin_id = [](const char *bin_id, int *column, int *row) -> bool {
      if (bin_id == nullptr || column == nullptr || row == nullptr) return false;
      const char *p = bin_id;
      while (*p == ' ' || *p == '\t') p++;
      char letter = *p;
      if (letter >= 'a' && letter <= 'z') letter = (char) (letter - ('a' - 'A'));
      if (letter < 'A' || letter > 'Z') return false;
      p++;
      int number = 0;
      bool any_digit = false;
      for (; *p != '\0'; p++) {
        const char ch = *p;
        if (ch >= '0' && ch <= '9') {
          number = number * 10 + (ch - '0');
          any_digit = true;
        } else if (ch == ' ' || ch == '\t' || ch == '-' || ch == '_') {
          continue;
        } else {
          return false;
        }
      }
      if (!any_digit || number < 1) return false;
      *row = letter - 'A';
      *column = number - 1;
      return true;
    };

  # Paint one strand from cell_rgb. Needs kRow, and row_extent and
  # bin_first_led declared ahead of it.
  paint_row: |-
    for (int i = 0; i < it.size(); i++) it[i] = Color(0, 0, 0);
    for (int col = 0; col < ${rack_cols}; col++) {
      int leds = 0;
      const int base = bin_first_led(col, kFirstA, kBinsA, kFirstB, kBinsB, &leds);
      if (base < 0) continue;
      const uint8_t *rgb = &id(cell_rgb)[(kRow * ${rack_cols} + col) * 3];
      for (int i = 0; i < leds && base + i < it.size(); i++)
        it[base + i] = Color(rgb[0], rgb[1], rgb[2]);
    }

  # How often a strand redraws itself. The picture is static between action
  # calls, so this is only how long a change takes to appear - 200 ms is
  # instant to a human and costs a fifth of the refreshes 100 ms would.
  redraw_interval: 200ms

  # --- Palette -------------------------------------------------------------
  # The dashboard's status colours, dimmed for LEDs a metre from your eyes in
  # a dark cellar. Keep the ratios if you brighten them: green and amber are
  # the two that get confused.
  colour_ready: "0, 110, 0" # dashboard --status-green
  colour_urgent: "150, 55, 0" # dashboard --status-amber
  colour_past: "140, 0, 0" # dashboard --status-red
  colour_aging: "0, 45, 120" # dashboard --accent-color
  colour_no_window: "35, 35, 35" # dashboard --status-grey
  colour_locate: "150, 120, 0" # the locator, when the caller passes r=g=b=0

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # No `includes:`. The coordinate map is the `${...}` C++ in the substitutions
  # above, so this node is one file with nothing beside it to copy or forget.

esp32:
  board: esp32dev
  framework:
    # fastled_clockless is Arduino-only. See note 3 above.
    type: arduino

logger:

api:
  encryption:
    key: !secret winerack1led_api_key

  actions:
    # --- Cellar overview, whole rack in one call --------------------------
    # `grid` is rack_cells state characters, row-major: A1..A13, then B1..B13,
    # and so on across the whole 13 x 13 envelope. Bins the U does not have
    # are sent as '.' like any other empty bin and light nothing.
    - action: light_rack
      variables:
        grid: string
      then:
        - lambda: |-
            for (int i = 0; i < ${rack_cells}; i++) {
              id(cell_state)[i] = i < (int) grid.length() ? (uint8_t) toupper(grid[i]) : (uint8_t) '.';
            }
        - script.execute: render

    # --- Cellar overview, one row -----------------------------------------
    # `states` is rack_cols characters for bins 1..13 of that row. Use this to
    # correct a single row; use light_rack for the whole picture.
    - action: light_row
      variables:
        row: string
        states: string
      then:
        - lambda: |-
            if (row.empty()) {
              ESP_LOGW("winerack", "light_row: no row given");
              return;
            }
            const int r = toupper(row[0]) - 'A';
            if (r < 0 || r >= ${rack_rows}) {
              ESP_LOGW("winerack", "light_row: '%s' is not a row between A and M", row.c_str());
              return;
            }
            for (int c = 0; c < ${rack_cols}; c++) {
              id(cell_state)[r * ${rack_cols} + c] =
                  c < (int) states.length() ? (uint8_t) toupper(states[c]) : (uint8_t) '.';
            }
        - script.execute: render

    # --- Locator ----------------------------------------------------------
    # Light one bin and nothing else. `bin_id` is a row letter and a column
    # number - "A2", "a-2" and "A 02" all mean the same bin. Pass r=g=b=0 for
    # the default locator colour. `seconds` is how long to hold it: 0 holds it
    # until something else changes the rack, anything above that restores the
    # overview when it expires.
    #
    # A bin inside the envelope but outside the rack - A7, say, in the U's
    # opening - is accepted and lights nothing. There are no pixels there.
    - action: light_bin
      variables:
        bin_id: string
        r: int
        g: int
        b: int
        seconds: int
      then:
        - lambda: |-
            // "A2", "a-2" and "A 02" all mean the same bin; anything that is
            // not a row letter followed by digits is refused. Tested in
            // tests/cpp rather than trusted - the same characters, compiled.
            ${parse_bin_id}
            int col = 0, row = 0;
            if (!parse_bin_id(bin_id.c_str(), &col, &row)) {
              ESP_LOGW("winerack", "light_bin: '%s' is not a bin id", bin_id.c_str());
              return;
            }
            if (row < 0 || row >= ${rack_rows} || col < 0 || col >= ${rack_cols}) {
              ESP_LOGW("winerack", "light_bin: '%s' is outside this rack", bin_id.c_str());
              return;
            }
            // Inside the envelope but not a bin the U actually has - a bottle
            // still filed at A7 after the rebuild, say. Worth saying out loud,
            // because the locator will simply light nothing. The row table
            // answers this: a column on neither of the row's pieces has no LED.
            const int kRow = row;
            ${row_extent}
            ${bin_first_led}
            if (bin_first_led(col, kFirstA, kBinsA, kFirstB, kBinsB, nullptr) < 0) {
              ESP_LOGI("winerack", "light_bin: '%s' is a bin this rack no longer has",
                       bin_id.c_str());
            }
            const Color fallback(${colour_locate});
            id(locate_cell) = row * ${rack_cols} + col;
            id(locate_r) = (r | g | b) ? r : fallback.r;
            id(locate_g) = (r | g | b) ? g : fallback.g;
            id(locate_b) = (r | g | b) ? b : fallback.b;
        - script.execute: render
        - if:
            condition:
              lambda: 'return seconds > 0;'
            then:
              - script.execute:
                  id: hold_locator
                  duration: !lambda 'return seconds;'
            else:
              - script.stop: hold_locator

    # --- Everything off ---------------------------------------------------
    - action: clear_all
      then:
        - script.stop: hold_locator
        - lambda: |-
            for (int i = 0; i < ${rack_cells}; i++) id(cell_state)[i] = (uint8_t) '.';
            id(locate_cell) = -1;
        - script.execute: render

ota:
  - platform: esphome
    password: !secret winerack1led_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # The DNS suffix this node registers under, leading dot included, e.g.
  # ".iot.example.com". Delete both lines if your network has no such suffix -
  # an empty secret is not the same thing as an absent option.
  domain: !secret wifi_domain

  # The fallback hotspot, for when the WiFi it is meant to join is not there.
  ap:
    ssid: !secret winerack1led_ap_ssid
    password: !secret winerack1led_ap_password

captive_portal:

# --- STATE -------------------------------------------------------------------
# Two arrays over the whole 13 x 13 envelope, both row-major and both indexed
# by cell: row * rack_cols + column. cell_state is what Home Assistant said;
# cell_rgb is what the strands draw, composed from it by the render script.
# Keeping them apart is what lets the locator hide the overview without
# destroying it. Cells the rack has no bin for stay black and no strand reads
# them.
globals:
  - id: cell_state
    type: uint8_t[169] # rack_cells
    restore_value: false

  - id: cell_rgb
    type: uint8_t[507] # rack_cells * 3
    restore_value: false

  # The cell the locator is showing, or -1 when it is not showing one.
  - id: locate_cell
    type: int
    restore_value: false
    initial_value: '-1'

  - id: locate_r
    type: int
    restore_value: false
    initial_value: '0'
  - id: locate_g
    type: int
    restore_value: false
    initial_value: '0'
  - id: locate_b
    type: int
    restore_value: false
    initial_value: '0'

# --- RENDERING ---------------------------------------------------------------
script:
  # Compose cell_rgb, then switch each strand on or off to match. Every action
  # ends here, so the whole rack is decided in one place.
  - id: render
    mode: restart
    then:
      - lambda: |-
          auto colour_of = [](uint8_t state) -> Color {
            switch (state) {
              case 'R': return Color(${colour_ready});
              case 'U': return Color(${colour_urgent});
              case 'P': return Color(${colour_past});
              case 'A': return Color(${colour_aging});
              case 'N': return Color(${colour_no_window});
              default:  return Color(0, 0, 0);
            }
          };

          // A locator answers "which bin", so it blacks out everything else
          // rather than competing with the overview for your attention.
          const int located = id(locate_cell);
          for (int i = 0; i < ${rack_cells}; i++) {
            Color c(0, 0, 0);
            if (located >= 0) {
              if (i == located)
                c = Color(id(locate_r), id(locate_g), id(locate_b));
            } else {
              c = colour_of(id(cell_state)[i]);
            }
            id(cell_rgb)[i * 3] = c.r;
            id(cell_rgb)[i * 3 + 1] = c.g;
            id(cell_rgb)[i * 3 + 2] = c.b;
          }

          // One strand per bin row, in row order. A row with nothing to show
          // is switched off, so Home Assistant's light entities say which rows
          // are lit. The LEDs still draw their idle current either way - off
          // here means black, not unpowered.
          esphome::light::LightState *strand[${rack_rows}] = {
            id(row_a), id(row_b), id(row_c), id(row_d), id(row_e),
            id(row_f), id(row_g), id(row_h), id(row_i), id(row_j),
            id(row_k), id(row_l), id(row_m),
          };

          for (int r = 0; r < ${rack_rows}; r++) {
            bool lit = false;
            for (int c = 0; c < ${rack_cols} && !lit; c++) {
              const uint8_t *rgb = &id(cell_rgb)[(r * ${rack_cols} + c) * 3];
              lit = rgb[0] || rgb[1] || rgb[2];
            }
            if (lit) {
              auto call = strand[r]->turn_on();
              call.set_effect("Rack");
              call.perform();
            } else {
              strand[r]->turn_off().perform();
            }
          }

  # Hands the overview back when a locator's hold expires. `mode: restart` so
  # locating a second bottle extends the hold rather than cutting it short.
  - id: hold_locator
    mode: restart
    parameters:
      duration: int
    then:
      - delay: !lambda 'return duration * 1000;'
      - lambda: 'id(locate_cell) = -1;'
      - script.execute: render

# --- STRANDS -----------------------------------------------------------------
# Everything the thirteen strands have in common. `num_leds` is not in here
# because it is not common: rows A-H are two jumpered pieces and shorter.
# See note 3 at the top for why these are FastLED strands.
#
# gamma_correct is off because these are status colours, not a dimmable white:
# the palette above should reach the LEDs as written. The light's brightness
# still scales the whole row, so Home Assistant's slider is a master dimmer.
.strand: &strand
  platform: fastled_clockless
  # The hardware is WS2815 - 12 V, and with the backup data line that keeps a
  # row alive when one pixel dies. ESPHome has no name for it because it
  # does not need one: WS2815 speaks the same 800 kHz protocol as a WS2812B,
  # so that is the chipset to declare. Wire the first pixel's BI pad alongside
  # its DI - on both pieces of a split row; left floating it can oscillate and
  # take the row with it.
  chipset: WS2812B
  rgb_order: GRB
  restore_mode: ALWAYS_OFF
  default_transition_length: 0s
  gamma_correct: 1.0

# The one effect every strand runs, and one literal per strand: which bin row
# it is. `row_extent` looks that up in `rack_table` to get the pieces the row
# is made of; `bin_first_led` turns a column into a run of pixels;
# `paint_row` walks the row and paints them. All three are the substitutions
# at the top of this file, so there are thirteen copies of a row number and
# one copy of the arithmetic.
#
# DATA AND POWER ENTER AT THE COLUMN-1 END of every row, and pixel 0 is that
# row's bin 1. The bin numbers count up along the strand, across the jumper on
# rows A-H, to bin 13 at the far end.
#
# It has to be an effect rather than direct pixel writes: with no effect
# running, any light command (a brightness change, a toggle from the Home
# Assistant UI) repaints the whole strand in the light's own colour and would
# wipe the picture.
light:
  # --- Rows A-H: the arms of the U, two pieces jumpered across it ---------
  - <<: *strand
    id: row_a
    name: "Row A"
    pin: GPIO4
    num_leds: ${split_strand}
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kRow = 0;
            ${row_extent}
            ${bin_first_led}
            ${paint_row}

  - <<: *strand
    id: row_b
    name: "Row B"
    pin: GPIO13
    num_leds: ${split_strand}
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kRow = 1;
            ${row_extent}
            ${bin_first_led}
            ${paint_row}

  # GPIO16 and GPIO17 are wired to the PSRAM on WROVER modules. Fine on the
  # plain WROOM this board uses; move these two rows if you reflash a WROVER.
  - <<: *strand
    id: row_c
    name: "Row C"
    pin: GPIO16
    num_leds: ${split_strand}
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kRow = 2;
            ${row_extent}
            ${bin_first_led}
            ${paint_row}

  - <<: *strand
    id: row_d
    name: "Row D"
    pin: GPIO17
    num_leds: ${split_strand}
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kRow = 3;
            ${row_extent}
            ${bin_first_led}
            ${paint_row}

  - <<: *strand
    id: row_e
    name: "Row E"
    pin: GPIO18
    num_leds: ${split_strand}
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kRow = 4;
            ${row_extent}
            ${bin_first_led}
            ${paint_row}

  - <<: *strand
    id: row_f
    name: "Row F"
    pin: GPIO19
    num_leds: ${split_strand}
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kRow = 5;
            ${row_extent}
            ${bin_first_led}
            ${paint_row}

  - <<: *strand
    id: row_g
    name: "Row G"
    pin: GPIO21
    num_leds: ${split_strand}
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kRow = 6;
            ${row_extent}
            ${bin_first_led}
            ${paint_row}

  - <<: *strand
    id: row_h
    name: "Row H"
    pin: GPIO22
    num_leds: ${split_strand}
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kRow = 7;
            ${row_extent}
            ${bin_first_led}
            ${paint_row}

  # --- Rows I-M: the base of the U, one unbroken piece of 13 bins ---------
  - <<: *strand
    id: row_i
    name: "Row I"
    pin: GPIO23
    num_leds: ${full_strand}
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kRow = 8;
            ${row_extent}
            ${bin_first_led}
            ${paint_row}

  - <<: *strand
    id: row_j
    name: "Row J"
    pin: GPIO25
    num_leds: ${full_strand}
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kRow = 9;
            ${row_extent}
            ${bin_first_led}
            ${paint_row}

  - <<: *strand
    id: row_k
    name: "Row K"
    pin: GPIO26
    num_leds: ${full_strand}
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kRow = 10;
            ${row_extent}
            ${bin_first_led}
            ${paint_row}

  - <<: *strand
    id: row_l
    name: "Row L"
    pin: GPIO27
    num_leds: ${full_strand}
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kRow = 11;
            ${row_extent}
            ${bin_first_led}
            ${paint_row}

  # GPIO32 rather than GPIO14: 14 is MTMS and emits a pulse during boot, which
  # would flick this row every time the board resets. 32 has no such habit.
  - <<: *strand
    id: row_m
    name: "Row M"
    pin: GPIO32
    num_leds: ${full_strand}
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kRow = 12;
            ${row_extent}
            ${bin_first_led}
            ${paint_row}
