# Wine rack 1 - bin lighting for the CellarTracker integration
# =============================================================================
#
# A U-shaped rack: rows A-H hold bins 1-4 and 10-13 with an opening across the
# middle, and rows I-M run the full width. 129 bins in a 13 x 13 envelope.
#
# One WS2815 strand per bin COLUMN, running top to bottom - see note 2 for why
# the strips are vertical rather than one per row. Home Assistant tells the
# board what to show; the board owns nothing but the pixels.
#
# Two things are drawn:
#
#   * The cellar overview - every bin painted with the same drinking-window
#     state the integration's dashboard paints it with, so the rack and
#     /cellartracker/cellar.html cannot tell you different things.
#   * A locator - one bin lit on its own, with everything else dark, for
#     "where is that bottle". It replaces the overview while it is showing and
#     hands it back when it times out.
#
# Actions exposed to Home Assistant (node name + action name):
#
#   esphome.winerack1led_light_rack   grid: 169 state characters, row-major
#   esphome.winerack1led_light_row    row: "A".."M", states: 13 characters
#   esphome.winerack1led_light_bin    bin_id: "A2", r/g/b: 0-255, seconds: hold
#   esphome.winerack1led_clear_all    turn everything off
#
# The action surface is unchanged by the rewiring. The grid stays row-major
# over the whole 13 x 13 envelope and bins the rack does not have are simply
# never lit - which also means a bottle CellarTracker still files at, say, A7
# quietly lights nothing, rather than lighting the wrong bin.
#
# State characters, which are the dashboard's five drinking-window states:
#
#   R  ready          - this year is inside the drinking window
#   U  urgent         - the final year of the window ("drink this year")
#   P  past           - the window closed before this year
#   A  aging          - the window has not opened yet
#   N  no window      - a bottle CellarTracker has no recommendation for
#   .  empty          - no bottle, or no bin there at all
#
# examples/home_assistant/wine_rack_leds.yaml builds those strings from the
# integration's inventory endpoint and calls the actions. The second rack has
# its own node: examples/esphome/winerack2led.yaml.
#
# -----------------------------------------------------------------------------
# Before you flash this
# -----------------------------------------------------------------------------
#
# 1. Secrets. Nothing about your network is written into this file - every
#    credential, and every name that would identify one house's network, is a
#    `!secret` reference. Your ESPHome secrets.yaml needs all seven:
#
#      wifi_ssid:                  the network to join
#      wifi_password:              its password
#      wifi_domain:                the DNS suffix to register under, leading
#                                  dot included (".iot.example.com"), or delete
#                                  the `domain:` line below if you have none
#      winerack1led_api_key:       `esphome generate-encryption-key`
#      winerack1led_ota_password:  anything long and random
#      winerack1led_ap_ssid:       the fallback hotspot's name
#      winerack1led_ap_password:   and its password, 8 characters or more
#
#    Anything that was ever pasted into a chat window or committed to a
#    repository should be regenerated before it goes in there.
#
# 2. Why the strips run vertically. The U has a hole in the middle of rows A-H,
#    and which way you run the strip decides whether that hole is a problem:
#
#      one strand per ROW     - 8 of the 13 strands are split in two by the
#                               opening, so each needs a jumper carrying 12 V,
#                               ground and data across half a metre of nothing,
#                               and the firmware has to skip five bins' worth
#                               of pixels that do not exist.
#      one strand per COLUMN  - every strand is contiguous. Columns 1-4 and
#                               10-13 run A to M; columns 5-9 exist only for
#                               rows I-M and are simply shorter strands.
#
#    Same thirteen strands, same 1122 pixels, eight fewer jumpers and no gaps
#    in any strand. That is the whole argument. A rectangular rack can go
#    either way; this one should not.
#
# 3. Why FastLED and not neopixelbus. A classic ESP32 has eight RMT channels
#    and two I2S buses to get WS2812-protocol timing from - ten strands' worth
#    of hardware for thirteen strands. That is a limit on how many can transmit
#    at once rather than on how many you can have, and it is the whole
#    difference between the two components: FastLED takes a channel per strand
#    as it goes and hands it back for the next one, so thirteen strands
#    transmit in batches, while neopixelbus pins one strand to one channel for
#    the life of the node and runs out. Its `bit_bang` fallback is not an
#    answer either - on ESP32 it does not compile.
#
#    `fastled_clockless` needs the Arduino framework, which is why `esp32:`
#    below asks for it.
#
# 4. Power. The strips are WS2815 on a 12 V rail. Budget a pixel at 0.3 W -
#    25 mA at 12 V - at full white, scaling with the sum of its channels,
#    plus about 1 mA standing for the controller and the backup-line logic:
#
#      (R + G + B) / 765 * 25 mA + 1 mA        @ 12 V
#
#    129 bins x 6 LEDs is 774 pixels that can be lit at once, out of 1122
#    powered. That makes this rack:
#
#      everything off ............................  1.1 A   (13 W)
#      every bin ready (0, 110, 0) ...............  3.9 A
#      every bin drink-this-year (150, 55, 0) ....  6.3 A   <- the worst case
#      per strand, at that worst case ............  0.6 A   (a 13-bin column)
#
#    So: a 12 V supply of 8.5 A for this rack alone, a 10 A fuse protecting a
#    16 AWG feed, and a single feed at the top of each column. A 1.1 m strand
#    at 0.6 A drops about 0.3 V, against the 1.5 V of budget between 12 V and
#    the 10.5 V a WS2815 wants. Measure your strip's copper before trusting
#    that; over 1 ohm/m per rail, feed both ends.
#
#    Rack 2 adds 2.4 A. One 12 V 12.5 A supply runs both if they are close
#    enough to share a bus; otherwise give each rack its own.
#
#    The 12 V rail powers only the LEDs. The ESP32 and the level shifters run
#    from a small 12 V -> 5 V buck off the same bus, and every ground - buck
#    included - returns to the PSU terminal rather than through a strip.
#
#    The palette is what keeps those numbers modest - no channel goes above
#    150, and gamma_correct is 1.0, so these values are what the pixels
#    actually draw. Halving `bin_leds` to 3 halves the lot and still reads as
#    a solid marker behind a bottle.
#
# =============================================================================

substitutions:
  device_name: winerack1led
  friendly_name: Wine Rack 1

  # --- Rack geometry -------------------------------------------------------
  # The envelope is 13 x 13; which of those bins exist is decided by the column
  # table in winerack1_geometry.h, which is also what the tests read. These
  # substitutions are the same numbers for the parts of the config that need a
  # literal - `num_leds` on each light, and the array sizes below.
  #
  # One column of the rack: N compartments of 6 LEDs separated by gaps of 3.
  # The last compartment has no gap after it, so a strand is N * 9 - 3.
  rack_rows: "13" # rows A..M
  rack_cols: "13" # bin columns 1..13, one strand each
  rack_cells: "169" # rack_rows * rack_cols, the whole envelope
  bin_leds: "6" # LEDs lit in front of one bin
  bin_pitch: "9" # LEDs from the start of one bin to the start of the next
  tall_strand: "114" # 13 bins, rows A..M  - columns 1-4 and 10-13
  short_strand: "42" # 5 bins, rows I..M   - columns 5-9, the U's opening

  # How often a strand redraws itself. The picture is static between action
  # calls, so this is only how long a change takes to appear - 200 ms is
  # instant to a human and costs a fifth of the refreshes 100 ms would.
  redraw_interval: 200ms

  # --- Palette -------------------------------------------------------------
  # The dashboard's status colours, dimmed for LEDs a metre from your eyes in
  # a dark cellar. Keep the ratios if you brighten them: green and amber are
  # the two that get confused.
  colour_ready: "0, 110, 0" # dashboard --status-green
  colour_urgent: "150, 55, 0" # dashboard --status-amber
  colour_past: "140, 0, 0" # dashboard --status-red
  colour_aging: "0, 45, 120" # dashboard --accent-color
  colour_no_window: "35, 35, 35" # dashboard --status-grey
  colour_locate: "150, 120, 0" # the locator, when the caller passes r=g=b=0

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # The coordinate mapping - which LEDs light bin (column, row) - lives in a
  # header rather than in twenty copies of the same lambda. It includes nothing
  # from ESPHome, which is what lets tests/cpp run it on a laptop; see
  # rack_geometry.h for why it is constexpr rather than a set of HA entities.
  includes:
    - rack_geometry.h
    - winerack1_geometry.h

esp32:
  board: esp32dev
  framework:
    # fastled_clockless is Arduino-only. See note 3 above.
    type: arduino

logger:

api:
  encryption:
    key: !secret winerack1led_api_key

  actions:
    # --- Cellar overview, whole rack in one call --------------------------
    # `grid` is rack_cells state characters, row-major: A1..A13, then B1..B13,
    # and so on across the whole 13 x 13 envelope. Bins the U does not have
    # are sent as '.' like any other empty bin and light nothing.
    - action: light_rack
      variables:
        grid: string
      then:
        - lambda: |-
            for (int i = 0; i < ${rack_cells}; i++) {
              id(cell_state)[i] = i < (int) grid.length() ? (uint8_t) toupper(grid[i]) : (uint8_t) '.';
            }
        - script.execute: render

    # --- Cellar overview, one row -----------------------------------------
    # `states` is rack_cols characters for bins 1..13 of that row. Use this to
    # correct a single row; use light_rack for the whole picture.
    - action: light_row
      variables:
        row: string
        states: string
      then:
        - lambda: |-
            if (row.empty()) {
              ESP_LOGW("winerack", "light_row: no row given");
              return;
            }
            const int r = toupper(row[0]) - 'A';
            if (r < 0 || r >= ${rack_rows}) {
              ESP_LOGW("winerack", "light_row: '%s' is not a row between A and M", row.c_str());
              return;
            }
            for (int c = 0; c < ${rack_cols}; c++) {
              id(cell_state)[r * ${rack_cols} + c] =
                  c < (int) states.length() ? (uint8_t) toupper(states[c]) : (uint8_t) '.';
            }
        - script.execute: render

    # --- Locator ----------------------------------------------------------
    # Light one bin and nothing else. `bin_id` is a row letter and a column
    # number - "A2", "a-2" and "A 02" all mean the same bin. Pass r=g=b=0 for
    # the default locator colour. `seconds` is how long to hold it: 0 holds it
    # until something else changes the rack, anything above that restores the
    # overview when it expires.
    #
    # A bin inside the envelope but outside the rack - A7, say, in the U's
    # opening - is accepted and lights nothing. There is no strand there.
    - action: light_bin
      variables:
        bin_id: string
        r: int
        g: int
        b: int
        seconds: int
      then:
        - lambda: |-
            // "A2", "a-2" and "A 02" all mean the same bin; anything that is
            // not a row letter followed by digits is refused. Tested in
            // tests/cpp rather than trusted.
            int col = 0, row = 0;
            if (!rack::parse_bin_id(bin_id.c_str(), &col, &row)) {
              ESP_LOGW("winerack", "light_bin: '%s' is not a bin id", bin_id.c_str());
              return;
            }
            if (row < 0 || row >= ${rack_rows} || col < 0 || col >= ${rack_cols}) {
              ESP_LOGW("winerack", "light_bin: '%s' is outside this rack", bin_id.c_str());
              return;
            }
            // Inside the envelope but not a bin the U actually has - a bottle
            // still filed at A7 after the rebuild, say. Worth saying out loud,
            // because the locator will simply light nothing.
            if (!winerack1::kRack.has_bin(col, row)) {
              ESP_LOGI("winerack", "light_bin: '%s' is a bin this rack no longer has",
                       bin_id.c_str());
            }
            const Color fallback(${colour_locate});
            id(locate_cell) = row * ${rack_cols} + col;
            id(locate_r) = (r | g | b) ? r : fallback.r;
            id(locate_g) = (r | g | b) ? g : fallback.g;
            id(locate_b) = (r | g | b) ? b : fallback.b;
        - script.execute: render
        - if:
            condition:
              lambda: 'return seconds > 0;'
            then:
              - script.execute:
                  id: hold_locator
                  duration: !lambda 'return seconds;'
            else:
              - script.stop: hold_locator

    # --- Everything off ---------------------------------------------------
    - action: clear_all
      then:
        - script.stop: hold_locator
        - lambda: |-
            for (int i = 0; i < ${rack_cells}; i++) id(cell_state)[i] = (uint8_t) '.';
            id(locate_cell) = -1;
        - script.execute: render

ota:
  - platform: esphome
    password: !secret winerack1led_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # The DNS suffix this node registers under, leading dot included, e.g.
  # ".iot.example.com". Delete both lines if your network has no such suffix -
  # an empty secret is not the same thing as an absent option.
  domain: !secret wifi_domain

  # The fallback hotspot, for when the WiFi it is meant to join is not there.
  ap:
    ssid: !secret winerack1led_ap_ssid
    password: !secret winerack1led_ap_password

captive_portal:

# --- STATE -------------------------------------------------------------------
# Two arrays over the whole 13 x 13 envelope, both row-major and both indexed
# by cell: row * rack_cols + column. cell_state is what Home Assistant said;
# cell_rgb is what the strands draw, composed from it by the render script.
# Keeping them apart is what lets the locator hide the overview without
# destroying it. Cells the rack has no bin for stay black and no strand reads
# them.
globals:
  - id: cell_state
    type: uint8_t[169] # rack_cells
    restore_value: false

  - id: cell_rgb
    type: uint8_t[507] # rack_cells * 3
    restore_value: false

  # The cell the locator is showing, or -1 when it is not showing one.
  - id: locate_cell
    type: int
    restore_value: false
    initial_value: '-1'

  - id: locate_r
    type: int
    restore_value: false
    initial_value: '0'
  - id: locate_g
    type: int
    restore_value: false
    initial_value: '0'
  - id: locate_b
    type: int
    restore_value: false
    initial_value: '0'

# --- RENDERING ---------------------------------------------------------------
script:
  # Compose cell_rgb, then switch each strand on or off to match. Every action
  # ends here, so the whole rack is decided in one place.
  - id: render
    mode: restart
    then:
      - lambda: |-
          auto colour_of = [](uint8_t state) -> Color {
            switch (state) {
              case 'R': return Color(${colour_ready});
              case 'U': return Color(${colour_urgent});
              case 'P': return Color(${colour_past});
              case 'A': return Color(${colour_aging});
              case 'N': return Color(${colour_no_window});
              default:  return Color(0, 0, 0);
            }
          };

          // A locator answers "which bin", so it blacks out everything else
          // rather than competing with the overview for your attention.
          const int located = id(locate_cell);
          for (int i = 0; i < ${rack_cells}; i++) {
            Color c(0, 0, 0);
            if (located >= 0) {
              if (i == located)
                c = Color(id(locate_r), id(locate_g), id(locate_b));
            } else {
              c = colour_of(id(cell_state)[i]);
            }
            id(cell_rgb)[i * 3] = c.r;
            id(cell_rgb)[i * 3 + 1] = c.g;
            id(cell_rgb)[i * 3 + 2] = c.b;
          }

          // One strand per bin column, in column order. A column with nothing
          // to show is switched off, so Home Assistant's light entities say
          // which columns are lit. The LEDs still draw their idle current
          // either way - off here means black, not unpowered.
          esphome::light::LightState *strand[${rack_cols}] = {
            id(col_01), id(col_02), id(col_03), id(col_04), id(col_05),
            id(col_06), id(col_07), id(col_08), id(col_09), id(col_10),
            id(col_11), id(col_12), id(col_13),
          };

          for (int c = 0; c < ${rack_cols}; c++) {
            bool lit = false;
            for (int r = 0; r < ${rack_rows} && !lit; r++) {
              const uint8_t *rgb = &id(cell_rgb)[(r * ${rack_cols} + c) * 3];
              lit = rgb[0] || rgb[1] || rgb[2];
            }
            if (lit) {
              auto call = strand[c]->turn_on();
              call.set_effect("Rack");
              call.perform();
            } else {
              strand[c]->turn_off().perform();
            }
          }

  # Hands the overview back when a locator's hold expires. `mode: restart` so
  # locating a second bottle extends the hold rather than cutting it short.
  - id: hold_locator
    mode: restart
    parameters:
      duration: int
    then:
      - delay: !lambda 'return duration * 1000;'
      - lambda: 'id(locate_cell) = -1;'
      - script.execute: render

# --- STRANDS -----------------------------------------------------------------
# Everything the thirteen strands have in common. `num_leds` is not in here
# because it is not common: columns 5-9 only exist for rows I-M and are short.
# See note 3 at the top for why these are FastLED strands.
#
# gamma_correct is off because these are status colours, not a dimmable white:
# the palette above should reach the LEDs as written. The light's brightness
# still scales the whole column, so Home Assistant's slider is a master dimmer.
.strand: &strand
  platform: fastled_clockless
  # The hardware is WS2815 - 12 V, and with the backup data line that keeps a
  # column alive when one pixel dies. ESPHome has no name for it because it
  # does not need one: WS2815 speaks the same 800 kHz protocol as a WS2812B,
  # so that is the chipset to declare. Wire the first pixel's BI pad alongside
  # its DI; left floating it can oscillate and take the column with it.
  chipset: WS2812B
  rgb_order: GRB
  restore_mode: ALWAYS_OFF
  default_transition_length: 0s
  gamma_correct: 1.0

# The one effect every strand runs. Two literals per strand say where it is:
# `col` is its bin column, 0-based, and `first_row` is the row its first pixel
# sits at. The loop then walks down the column, one bin per bin_pitch pixels,
# and stops when it runs off the end of the strand - which is what lets the
# short columns share the same code as the tall ones.
#
# Pixel 0 is the TOP bin of each column and the strand runs downward. Feed and
# data enter at the top. If you would rather wire from the floor up, reverse
# the strip and set `first_row` to the bottom row, counting up.
#
# It has to be an effect rather than direct pixel writes: with no effect
# running, any light command (a brightness change, a toggle from the Home
# Assistant UI) repaints the whole strand in the light's own colour and would
# wipe the picture.
light:
  # --- Columns 1-4: the left arm of the U, rows A to M ----------------------
  - <<: *strand
    id: col_01
    name: "Column 1"
    pin: GPIO4
    num_leds: ${tall_strand}
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kCol = 0;
            for (int i = 0; i < it.size(); i++) it[i] = Color(0, 0, 0);
            rack::for_each_bin(winerack1::kRack, kCol, [&](int row, rack::Span s) {
              const uint8_t *rgb = &id(cell_rgb)[(row * 13 + kCol) * 3];
              for (int i = 0; i < s.count && s.first + i < it.size(); i++)
                it[s.first + i] = Color(rgb[0], rgb[1], rgb[2]);
            });

  - <<: *strand
    id: col_02
    name: "Column 2"
    pin: GPIO13
    num_leds: ${tall_strand}
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kCol = 1;
            for (int i = 0; i < it.size(); i++) it[i] = Color(0, 0, 0);
            rack::for_each_bin(winerack1::kRack, kCol, [&](int row, rack::Span s) {
              const uint8_t *rgb = &id(cell_rgb)[(row * 13 + kCol) * 3];
              for (int i = 0; i < s.count && s.first + i < it.size(); i++)
                it[s.first + i] = Color(rgb[0], rgb[1], rgb[2]);
            });

  # GPIO16 and GPIO17 are wired to the PSRAM on WROVER modules. Fine on the
  # plain WROOM this board uses; move these two columns if you reflash a WROVER.
  - <<: *strand
    id: col_03
    name: "Column 3"
    pin: GPIO16
    num_leds: ${tall_strand}
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kCol = 2;
            for (int i = 0; i < it.size(); i++) it[i] = Color(0, 0, 0);
            rack::for_each_bin(winerack1::kRack, kCol, [&](int row, rack::Span s) {
              const uint8_t *rgb = &id(cell_rgb)[(row * 13 + kCol) * 3];
              for (int i = 0; i < s.count && s.first + i < it.size(); i++)
                it[s.first + i] = Color(rgb[0], rgb[1], rgb[2]);
            });

  - <<: *strand
    id: col_04
    name: "Column 4"
    pin: GPIO17
    num_leds: ${tall_strand}
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kCol = 3;
            for (int i = 0; i < it.size(); i++) it[i] = Color(0, 0, 0);
            rack::for_each_bin(winerack1::kRack, kCol, [&](int row, rack::Span s) {
              const uint8_t *rgb = &id(cell_rgb)[(row * 13 + kCol) * 3];
              for (int i = 0; i < s.count && s.first + i < it.size(); i++)
                it[s.first + i] = Color(rgb[0], rgb[1], rgb[2]);
            });

  # --- Columns 5-9: the base of the U only, rows I to M --------------------
  # Five bins each. `first_row = 8` is row I, so pixel 0 of these strands sits
  # at the top of the U's opening rather than at the top of the rack.
  - <<: *strand
    id: col_05
    name: "Column 5"
    pin: GPIO18
    num_leds: ${short_strand}
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kCol = 4;
            for (int i = 0; i < it.size(); i++) it[i] = Color(0, 0, 0);
            rack::for_each_bin(winerack1::kRack, kCol, [&](int row, rack::Span s) {
              const uint8_t *rgb = &id(cell_rgb)[(row * 13 + kCol) * 3];
              for (int i = 0; i < s.count && s.first + i < it.size(); i++)
                it[s.first + i] = Color(rgb[0], rgb[1], rgb[2]);
            });

  - <<: *strand
    id: col_06
    name: "Column 6"
    pin: GPIO19
    num_leds: ${short_strand}
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kCol = 5;
            for (int i = 0; i < it.size(); i++) it[i] = Color(0, 0, 0);
            rack::for_each_bin(winerack1::kRack, kCol, [&](int row, rack::Span s) {
              const uint8_t *rgb = &id(cell_rgb)[(row * 13 + kCol) * 3];
              for (int i = 0; i < s.count && s.first + i < it.size(); i++)
                it[s.first + i] = Color(rgb[0], rgb[1], rgb[2]);
            });

  - <<: *strand
    id: col_07
    name: "Column 7"
    pin: GPIO21
    num_leds: ${short_strand}
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kCol = 6;
            for (int i = 0; i < it.size(); i++) it[i] = Color(0, 0, 0);
            rack::for_each_bin(winerack1::kRack, kCol, [&](int row, rack::Span s) {
              const uint8_t *rgb = &id(cell_rgb)[(row * 13 + kCol) * 3];
              for (int i = 0; i < s.count && s.first + i < it.size(); i++)
                it[s.first + i] = Color(rgb[0], rgb[1], rgb[2]);
            });

  - <<: *strand
    id: col_08
    name: "Column 8"
    pin: GPIO22
    num_leds: ${short_strand}
    effects:
      - addressable_lambda:
          name: Rack
          update_interval: ${redraw_interval}
          lambda: |-
            constexpr int kCol = 7;
            for (int i = 0; i < it.size(); i++) it[i] = Color(0, 0, 0);
            rack::for_each_bin(winerack1::kRack, kCol, [&](int row, rack::Span s) {
              const uint8_t *rgb = &id(cell_rgb)[(row * 13 + kCol) * 3];
