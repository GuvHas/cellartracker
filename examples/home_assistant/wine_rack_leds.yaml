# Wine racks 1 and 2 - driving the rack LEDs from CellarTracker
# =============================================================================
#
# Turns the integration's inventory into the strings the two ESPHome nodes
# paint:
#
#   examples/esphome/winerack1led.yaml   the U-shaped rack, 13 x 13 envelope,
#                                        129 bins - rows A-H hold bins 1-4 and
#                                        10-13, rows I-M run the full width
#   examples/esphome/winerack2led.yaml   the second rack, a full 7 x 7
#
# One HTTP request serves both: the inventory endpoint returns the whole
# cellar, and each rack's sensor picks its own bottles out of it by Location.
#
# Install as a package. In configuration.yaml:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# then save this file as <config>/packages/wine_rack_leds.yaml and restart.
#
# -----------------------------------------------------------------------------
# What you have to set
# -----------------------------------------------------------------------------
#
# 1. A long-lived access token. The inventory endpoint is authenticated, so
#    Home Assistant needs a token to read its own API. Create one under your
#    profile -> Security -> Long-lived access tokens, then put it in
#    secrets.yaml *with the word Bearer in front of it*:
#
#      home_assistant_token: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6..."
#
#    The token is full-account and never expires. Keep it in secrets.yaml, not
#    in this file, and revoke it from the same page if it ever leaks.
#
# 2. The two CellarTracker location names, in RACK_LOCATION in each template
#    below. They have to match the `Location` column of the bottles in that
#    rack exactly - that is the rack, and `Bin` is the slot inside it. Check a
#    bottle's location on the dashboard if you are not sure.
#
# 3. Your own entity IDs. `sensor.cellartracker_last_synchronised` below is the
#    integration's sync sensor; a fresh install names it after your account
#    (sensor.<account>_last_synchronised), and an install predating v0.0.18
#    still calls it sensor.<account>_status. Settings -> Devices & Services ->
#    CellarTracker -> entities has the exact ID.
#
# 4. Bins the shape each rack expects: a row letter and a column number, so
#    "A2" or "C4". "a-2", "A 2" and "A02" are read the same way. Anything else
#    is dropped rather than lit in the wrong place.
#
# -----------------------------------------------------------------------------
# The U, and bottles that fall in its hole
# -----------------------------------------------------------------------------
#
# Rack 1's grid stays a full 13 x 13 - 169 characters - even though the rack
# only has 129 bins. The bins the U does not have simply never hold a bottle,
# so they come through as empty and light nothing. Nothing here needs to know
# the shape.
#
# The exception is a bottle CellarTracker still files at a bin that no longer
# exists, which is easy after rebuilding a rack. It is not lost and it is not
# mis-lit: there is no strand there, so it stays dark. The orphan sensor below
# counts them so a rebuild does not quietly swallow bottles.
#
# =============================================================================

rest:
  # One local request for the whole cellar, feeding every sensor below. The
  # integration renders this body when it polls CellarTracker, so serving it
  # costs nothing and asking for it never touches the network.
  #
  # Change the host if Home Assistant is not on 8123, or if you have configured
  # `http: ssl_certificate` - then it is https and its own hostname, because a
  # certificate will not match 127.0.0.1.
  - resource: http://127.0.0.1:8123/api/cellartracker/inventory?view=compact
    method: GET
    timeout: 30
    # The cellar is polled every six hours by default, and the automation below
    # asks for a fresh fetch as soon as it syncs. This is only the safety net
    # for a missed sync, so it does not need to be frequent.
    scan_interval: 3600
    headers:
      Authorization: !secret home_assistant_token
    sensor:
      # --- Rack 1: the U, 13 x 13 envelope ---------------------------------
      # One character per bin, row-major: A1..A13, then B1..B13, and so on.
      # 169 characters, which fits inside a state's 255-character limit. Add
      # these entities to `recorder: exclude:` if you would rather not keep the
      # history - they change only when the cellar does.
      - name: Wine rack 1 grid
        unique_id: wine_rack_1_grid
        icon: mdi:grid
        value_template: |-
          {%- set RACK_LOCATION = 'Wine Rack 1' -%}
          {%- set rows = 'ABCDEFGHIJKLM' -%}
          {%- set cols = 13 -%}
          {#- The year is read once per fetch, the same way the integration's
              own counts are (cellar_data._current_year). A cellar polled every
              six hours notices the new year within six hours of midnight. -#}
          {%- set year = now().year -%}
          {%- set ns = namespace(cells = [0] * (rows | length * cols)) -%}
          {%- for bottle in value_json -%}
            {%- set slot = bottle.Bin | default('', true) | string | trim | upper -%}
            {%- if (bottle.Location | default('', true) | string | trim) == RACK_LOCATION
                   and slot | length > 1 -%}
              {%- set row = rows.find(slot[0]) -%}
              {%- set col = slot[1:] | regex_findall('[0-9]+') | first | default(0) | int(0) -%}
              {%- if row >= 0 and 1 <= col <= cols -%}
                {%- set begin = bottle.BeginConsume | default(0, true) | int(0) -%}
                {%- set end = bottle.EndConsume | default(0, true) | int(0) -%}
                {#- The dashboard's rule, in the dashboard's order: an inverted
                    window (from 2030, by 2020) reads as over rather than as
                    still laying down, and the final year of a window is urgent
                    rather than past, because it is still inside the window. -#}
                {%- set rank = 1 if (begin < 1 and end < 1)
                          else 5 if (end > 0 and end < year)
                          else 2 if (begin > 0 and begin > year)
                          else 4 if end == year
                          else 3 -%}
                {#- A bin holds several bottles. Show the one that most wants
                    dealing with: past, then drink-this-year, then ready, then
                    aging, then a bottle with no window at all. -#}
                {%- set cell = row * cols + col - 1 -%}
                {%- if rank > ns.cells[cell] -%}
                  {%- set ns.cells = ns.cells[:cell] + [rank] + ns.cells[cell + 1:] -%}
                {%- endif -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {%- for rank in ns.cells %}{{ '.NARUP'[rank] }}{% endfor -%}

      # --- Rack 2: a full 7 x 7 ---------------------------------------------
      # Same template, smaller rack: 49 characters, rows A-G, bins 1-7.
      - name: Wine rack 2 grid
        unique_id: wine_rack_2_grid
        icon: mdi:grid
        value_template: |-
          {%- set RACK_LOCATION = 'Wine Rack 2' -%}
          {%- set rows = 'ABCDEFG' -%}
          {%- set cols = 7 -%}
          {%- set year = now().year -%}
          {%- set ns = namespace(cells = [0] * (rows | length * cols)) -%}
          {%- for bottle in value_json -%}
            {%- set slot = bottle.Bin | default('', true) | string | trim | upper -%}
            {%- if (bottle.Location | default('', true) | string | trim) == RACK_LOCATION
                   and slot | length > 1 -%}
              {%- set row = rows.find(slot[0]) -%}
              {%- set col = slot[1:] | regex_findall('[0-9]+') | first | default(0) | int(0) -%}
              {%- if row >= 0 and 1 <= col <= cols -%}
                {%- set begin = bottle.BeginConsume | default(0, true) | int(0) -%}
                {%- set end = bottle.EndConsume | default(0, true) | int(0) -%}
                {%- set rank = 1 if (begin < 1 and end < 1)
                          else 5 if (end > 0 and end < year)
                          else 2 if (begin > 0 and begin > year)
                          else 4 if end == year
                          else 3 -%}
                {%- set cell = row * cols + col - 1 -%}
                {%- if rank > ns.cells[cell] -%}
                  {%- set ns.cells = ns.cells[:cell] + [rank] + ns.cells[cell + 1:] -%}
                {%- endif -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {%- for rank in ns.cells %}{{ '.NARUP'[rank] }}{% endfor -%}

      # --- Bottles filed in bins rack 1 no longer has ------------------------
      # Rows A-H of the U only have bins 1-4 and 10-13. A bottle still recorded
      # at A7 after the rebuild is not lost, but nothing will ever light for
      # it. This counts them so you know to re-bin them in CellarTracker.
      - name: Wine rack 1 bottles in missing bins
        unique_id: wine_rack_1_orphan_bins
        icon: mdi:map-marker-question
        unit_of_measurement: bottles
        state_class: measurement
        value_template: |-
          {%- set RACK_LOCATION = 'Wine Rack 1' -%}
          {%- set rows = 'ABCDEFGHIJKLM' -%}
          {%- set ns = namespace(orphans = 0) -%}
          {%- for bottle in value_json -%}
            {%- set slot = bottle.Bin | default('', true) | string | trim | upper -%}
            {%- if (bottle.Location | default('', true) | string | trim) == RACK_LOCATION
                   and slot | length > 1 -%}
              {%- set row = rows.find(slot[0]) -%}
              {%- set col = slot[1:] | regex_findall('[0-9]+') | first | default(0) | int(0) -%}
              {#- The U: rows A-H (0-7) exist only at columns 1-4 and 10-13.
                  Rows I-M (8-12) are full width. Anything else is nowhere. -#}
              {%- set inside = (row >= 8 and row <= 12 and 1 <= col <= 13)
                            or (row >= 0 and row <= 7 and (1 <= col <= 4 or 10 <= col <= 13)) -%}
              {%- if not inside -%}
                {%- set ns.orphans = ns.orphans + 1 -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.orphans }}

automation:
  # --- Keep both grids in step with the cellar --------------------------------
  - id: wine_rack_refresh_grids
    alias: "Wine racks: re-read the cellar when it syncs"
    description: >-
      The integration publishes a new inventory when it polls CellarTracker.
      Fetching on that rather than on a timer is what keeps the racks no more
      stale than the cellar itself. One request serves both racks.
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.cellartracker_last_synchronised
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.to_state.state not in ['unknown', 'unavailable', none] }}
    actions:
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.wine_rack_1_grid
            - sensor.wine_rack_2_grid
            - sensor.wine_rack_1_bottles_in_missing_bins

  # --- Push each grid to its own rack -----------------------------------------
  - id: wine_rack_1_push_grid
    alias: "Wine rack 1: paint the rack"
    description: >-
      One call paints all thirteen columns, so the rack is never half old and
      half new. The board keeps a locator showing over the top of this, so a
      repaint that lands while you are looking for a bottle does not steal the
      answer.
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.wine_rack_1_grid
        id: grid
      # The board forgets everything it was showing when it reboots, and its
      # entities go unavailable and back while it does. Repainting on that is
      # what stops a power cut leaving the rack dark until the next sync.
      - trigger: state
        entity_id: light.wine_rack_1_column_1
        from: unavailable
        id: reconnected
      - trigger: homeassistant
        event: start
        id: reconnected
    conditions:
      - condition: template
        value_template: >-
          {{ states('sensor.wine_rack_1_grid') not in ['unknown', 'unavailable', ''] }}
    actions:
      - if:
          - condition: trigger
            id: reconnected
        then:
          - delay: "00:00:05"
      - action: esphome.winerack1led_light_rack
        continue_on_error: true
        data:
          grid: "{{ states('sensor.wine_rack_1_grid') }}"

  - id: wine_rack_2_push_grid
    alias: "Wine rack 2: paint the rack"
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.wine_rack_2_grid
        id: grid
      - trigger: state
        entity_id: light.wine_rack_2_column_1
        from: unavailable
        id: reconnected
      - trigger: homeassistant
        event: start
        id: reconnected
    conditions:
      - condition: template
        value_template: >-
          {{ states('sensor.wine_rack_2_grid') not in ['unknown', 'unavailable', ''] }}
    actions:
      - if:
          - condition: trigger
            id: reconnected
        then:
          - delay: "00:00:05"
      - action: esphome.winerack2led_light_rack
        continue_on_error: true
        data:
          grid: "{{ states('sensor.wine_rack_2_grid') }}"

script:
  # --- Where is that bottle? --------------------------------------------------
  # Copy a bin from the dashboard's bottle drawer, pick its rack, run this.
  wine_rack_locate:
    alias: "Wine racks: light one bin"
    description: Light a single bin on one rack and dim the rest until it times out.
    mode: single
    fields:
      rack:
        name: Rack
        description: Which rack the bottle is in.
        required: true
        default: 1
        selector:
          select:
            options:
              - label: Rack 1 - the U
                value: "1"
              - label: Rack 2 - the 7 by 7
                value: "2"
      bin:
        name: Bin
        description: 'The bin to light, as a row letter and a column: A2.'
        required: true
        example: A2
        selector:
          text:
      seconds:
        name: Hold for
        description: >-
          How long to hold it before the cellar overview comes back. 0 holds it
          until something else changes the rack.
        default: 120
        selector:
          number:
            min: 0
            max: 3600
            unit_of_measurement: s
            mode: box
      colour:
        name: Colour
        description: >-
          The locator colour as [r, g, b]. Leave it alone for the board's own,
          which is chosen not to be mistaken for any of the status colours.
        default: [0, 0, 0]
        selector:
          object:
    sequence:
      - variables:
          payload:
            bin_id: "{{ bin }}"
            r: "{{ (colour | default([0, 0, 0]))[0] | int(0) }}"
            g: "{{ (colour | default([0, 0, 0]))[1] | int(0) }}"
            b: "{{ (colour | default([0, 0, 0]))[2] | int(0) }}"
            seconds: "{{ seconds | default(120) | int(120) }}"
      - choose:
          - conditions: "{{ rack | string == '2' }}"
            sequence:
              - action: esphome.winerack2led_light_bin
                data: "{{ payload }}"
        default:
          - action: esphome.winerack1led_light_bin
            data: "{{ payload }}"

  # --- Put both racks out -----------------------------------------------------
  # The overview comes back on the next sync, or run wine_rack_show_overview.
  wine_rack_clear:
    alias: "Wine racks: turn the LEDs off"
    mode: single
    sequence:
      - action: esphome.winerack1led_clear_all
        continue_on_error: true
        data: {}
      - action: esphome.winerack2led_clear_all
        continue_on_error: true
        data: {}

  # --- Put the overviews back without waiting for a sync ----------------------
  wine_rack_show_overview:
    alias: "Wine racks: show the cellar overview"
    mode: single
    sequence:
      - action: esphome.winerack1led_light_rack
        continue_on_error: true
        data:
          grid: "{{ states('sensor.wine_rack_1_grid') }}"
      - action: esphome.winerack2led_light_rack
        continue_on_error: true
        data:
          grid: "{{ states('sensor.wine_rack_2_grid') }}"
